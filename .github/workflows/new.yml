name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/samoht83/android_kernel_oneplus_sm4350/blob/lineage-22.2/stock/original_boot.img?raw=true'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils lld wget file

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/linux-x86/clang
          key: ${{ runner.os }}-clang-18-v2
          restore-keys: |
            ${{ runner.os }}-clang-18-

      - name: Download and Extract Clang Toolchain (with fallback)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p toolchain/linux-x86
          cd toolchain/linux-x86

          PRIMARY_URL="https://github.com/Its-Vichy/prebuilt-linux-x86-clang/releases/download/510928/clang-r510928.tar.gz"
          FALLBACK_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz"

          echo "Trying primary URL..."
          if wget --spider --quiet "$PRIMARY_URL" 2>/dev/null; then
            echo "Primary URL reachable — downloading..."
            wget -q "$PRIMARY_URL" -O clang-r510928.tar.gz
            if file clang-r510928.tar.gz | grep -q 'gzip compressed data'; then
              tar -xzf clang-r510928.tar.gz
              # some archives extract to clang-r510928, try to normalize to clang/
              if [ -d clang-r510928 ]; then
                mv clang-r510928 clang
              else
                # if extracted dir name differs, attempt to find top-level dir and rename
                TOPDIR=$(tar -tzf clang-r510928.tar.gz | head -1 | cut -f1 -d"/")
                if [ -n "$TOPDIR" ] && [ -d "$TOPDIR" ]; then
                  mv "$TOPDIR" clang
                fi
              fi
              rm clang-r510928.tar.gz
            else
              echo "Primary archive is not a valid gzip archive — aborting primary attempt."
              rm -f clang-r510928.tar.gz
              PRIMARY_OK=0
            fi
          else
            echo "Primary URL not available."
          fi

          # If clang/ not created, try fallback
          if [ ! -d clang ]; then
            echo "Trying official LLVM release as fallback..."
            wget -q "$FALLBACK_URL" -O clang-fallback.tar.xz || true
            if [ -f clang-fallback.tar.xz ] && file clang-fallback.tar.xz | grep -q 'XZ compressed data'; then
              tar -xf clang-fallback.tar.xz
              # fallback archive usually expands to a long name; normalize to clang/
              FALLBACK_TOPDIR=$(tar -tf clang-fallback.tar.xz | head -1 | cut -f1 -d"/")
              if [ -d "$FALLBACK_TOPDIR" ]; then
                mv "$FALLBACK_TOPDIR" clang
              fi
              rm -f clang-fallback.tar.xz
            else
              echo "Fallback download failed or not an XZ archive. Using system clang/lld as last resort."
              mkdir -p clang/bin
              sudo apt-get update
              sudo apt-get install -y clang-18 lld-18 llvm-18-tools
              ln -sf /usr/bin/clang-18 clang/bin/clang
              ln -sf /usr/bin/clang++-18 clang/bin/clang++
              # prefer ld.lld-18 if available
              if [ -x /usr/bin/ld.lld-18 ]; then
                ln -sf /usr/bin/ld.lld-18 clang/bin/ld.lld
              elif [ -x /usr/bin/ld.lld ]; then
                ln -sf /usr/bin/ld.lld clang/bin/ld.lld
              fi
              ln -sf /usr/bin/llvm-ar-18 clang/bin/llvm-ar || true
              ln -sf /usr/bin/llvm-nm-18 clang/bin/llvm-nm || true
              ln -sf /usr/bin/llvm-objdump-18 clang/bin/llvm-objdump || true
              ln -sf /usr/bin/llvm-strip-18 clang/bin/llvm-strip || true
            fi
          fi

          # Ensure executables are present
          if [ -d clang/bin ]; then
            chmod +x clang/bin/* 2>/dev/null || true
          fi

      - name: Debug Clang toolchain files
        run: |
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin
          echo "CLANG_BIN=$CLANG_BIN"
          ls -la "$CLANG_BIN" || true
          echo "Which clang: $(which clang || true)"

      - name: Fix Missing LLVM Tools
        run: |
          sudo apt-get install -y llvm-18-tools
          cd toolchain/linux-x86/clang/bin
          
          # Create missing tools if needed
          [ ! -f llvm-objcopy ] && ln -sf /usr/bin/llvm-objcopy-18 llvm-objcopy || true
          [ ! -f llvm-readelf ] && ln -sf /usr/bin/llvm-readelf-18 llvm-readelf || true
          
          echo "Available LLVM tools:"
          ls -la llvm-* || true

      - name: Set up Environment
        run: |
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "LD=$CLANG_BIN/ld.lld" >> $GITHUB_ENV
          echo "AR=$CLANG_BIN/llvm-ar" >> $GITHUB_ENV
          echo "NM=$CLANG_BIN/llvm-nm" >> $GITHUB_ENV
          echo "OBJDUMP=$CLANG_BIN/llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=$CLANG_BIN/llvm-strip" >> $GITHUB_ENV
          echo "OBJCOPY=$CLANG_BIN/llvm-objcopy" >> $GITHUB_ENV
          echo "READELF=$CLANG_BIN/llvm-readelf" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Set up GCC Cross-Compiler
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
          echo "$GITHUB_WORKSPACE/gcc/bin" >> $GITHUB_PATH

      - name: Clone and Set Up KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ inputs.kernelsu_version }}
          tee -a arch/arm64/configs/n200_defconfig > /dev/null <<'EOF'
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KERNELSU=y
          CONFIG_KERNELSU_MODULE_SEPARATED=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_ELFCORE=y
          CONFIG_PROC_FS=y
          CONFIG_TMPFS=y
          EOF

      - name: Fix missing sensor_proc_dir symbol (safe)
        run: |
          set -euo pipefail
          # Try to find a real non-extern definition
          DEF_FILE=$(grep -R --line-number --no-messages "^[[:space:]]*struct[[:space:]]\\+proc_dir_entry[[:space:]]\\+\\*sensor_proc_dir" soc || true)
          if [ -z "$DEF_FILE" ]; then
            echo "No concrete definition found — adding a small stub (non-destructive)."
            mkdir -p drivers/misc
            cat > drivers/misc/sensor_proc_stub.c <<'EOF'
          #include <linux/proc_fs.h>
          struct proc_dir_entry *sensor_proc_dir;
          EXPORT_SYMBOL(sensor_proc_dir);
          EOF
            # Ensure Makefile exists and add a line if not present
            MF=drivers/misc/Makefile
            if [ ! -f "$MF" ]; then
              echo -e "obj-y :=\n" > "$MF"
            fi
            if ! grep -q "sensor_proc_stub.o" "$MF"; then
              echo "" >> "$MF"
              echo "# Added by CI: provide stub for sensor_proc_dir" >> "$MF"
              echo "obj-y += sensor_proc_stub.o" >> "$MF"
            fi
            echo "# CI-added: sensor_proc_stub to satisfy missing symbol" >> arch/arm64/configs/n200_defconfig
          else
            echo "Found real definition(s):"
            echo "$DEF_FILE"
            echo "Enabling CONFIG_OPLUS_SENSOR_DEVINFO in defconfig."
            echo "CONFIG_OPLUS_SENSOR_DEVINFO=y" >> arch/arm64/configs/n200_defconfig
          fi

      - name: Build Kernel
        run: |
          set -euo pipefail
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin
          
          echo "Building kernel configuration..."
          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=${CLANG_BIN}/clang \
            LD=${CLANG_BIN}/ld.lld \
            AR=${CLANG_BIN}/llvm-ar \
            NM=${CLANG_BIN}/llvm-nm \
            OBJDUMP=${CLANG_BIN}/llvm-objdump \
            STRIP=${CLANG_BIN}/llvm-strip \
            OBJCOPY=${CLANG_BIN}/llvm-objcopy \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            n200_defconfig

          echo "Building kernel image..."
          make -j$(nproc) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=${CLANG_BIN}/clang \
            LD=${CLANG_BIN}/ld.lld \
            AR=${CLANG_BIN}/llvm-ar \
            NM=${CLANG_BIN}/llvm-nm \
            OBJDUMP=${CLANG_BIN}/llvm-objdump \
            STRIP=${CLANG_BIN}/llvm-strip \
            OBJCOPY=${CLANG_BIN}/llvm-objcopy \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: Check Build Output
        run: |
          ls -la out/arch/arm64/boot/
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel build successful!"
            echo "Image size: $(stat -c%s out/arch/arm64/boot/Image) bytes"
          else
            echo "❌ Kernel build failed - Image not found"
            exit 1
          fi

      - name: Download Stock Boot Image
        run: |
          mkdir -p stock
          wget -O stock/stock_boot.img "${{ inputs.stock_boot_url }}"

      - name: Install MagiskBoot (preferred for repack)
        run: |
          curl -LO https://raw.githubusercontent.com/topjohnwu/magisk-files/main/tools/magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Unpack and Repack Boot Image with MagiskBoot
        run: |
          mkdir -p extracted
          cd extracted
          magiskboot unpack ../stock/stock_boot.img
          cp ../out/arch/arm64/boot/Image kernel
          # magiskboot repack will reuse original header/ramdisk params
          magiskboot repack ../stock/stock_boot.img
          cp new-boot.img ../kernelsu_boot.img
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-build-${{ inputs.kernelsu_version }}-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image
            kernelsu_boot.img
            arch/arm64/configs/n200_defconfig
            out/.config
          retention-days: 30

      - name: Create Release Summary
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU Version:** ${{ inputs.kernelsu_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Image Size:** $(stat -c%s out/arch/arm64/boot/Image) bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Image Size:** $(stat -c%s kernelsu_boot.img) bytes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- \`Image\` - Raw kernel image" >> $GITHUB_STEP_SUMMARY
          echo "- \`kernelsu_boot.img\` - Ready-to-flash boot image" >> $GITHUB_STEP_SUMMARY
          echo "- \`n200_defconfig\` - Modified kernel configuration" >> $GITHUB_STEP_SUMMARY
          echo "- \`.config\` - Final build configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Installation" >> $GITHUB_STEP_SUMMARY
          echo "Flash \`kernelsu_boot.img\` to your boot partition:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "fastboot flash boot kernelsu_boot.img" >> $GITHUB_STEP_SUMMARY
          echo "fastboot reboot" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY