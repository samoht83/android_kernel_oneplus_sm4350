name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/samoht83/android_kernel_oneplus_sm4350/blob/lineage-22.2/stock/original_boot.img?raw=true'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils lld

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/linux-x86/clang
          key: ${{ runner.os }}-clang-18-v2
          restore-keys: |
            ${{ runner.os }}-clang-18-

      - name: Download and Extract Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/linux-x86
          cd toolchain/linux-x86
          
          # Primary URL
          PRIMARY_URL="https://github.com/Its-Vichy/prebuilt-linux-x86-clang/releases/download/510928/clang-r510928.tar.gz"
          # Fallback URL - using ubuntu-22.04 for GitHub Actions runners
          FALLBACK_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          
          echo "Attempting to download from primary URL..."
          if wget --spider "$PRIMARY_URL" 2>/dev/null; then
            echo "Primary URL is available. Downloading..."
            wget "$PRIMARY_URL"
            if file clang-r510928.tar.gz | grep -q 'gzip compressed data'; then
              tar -xzf clang-r510928.tar.gz
              mv clang-r510928 clang
              rm clang-r510928.tar.gz
            else
              echo "Downloaded file is not a valid gzip archive!"
              exit 1
            fi
          else
            echo "Primary URL failed. Using official LLVM release as fallback..."
            
            # Download the fallback file
            if wget "$FALLBACK_URL"; then
              # Verify it's an xz file
              if file clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz | grep -q 'XZ compressed data'; then
                echo "Extracting LLVM toolchain..."
                tar -xf clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz
                mv clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04 clang
                rm clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz
              else
                echo "Downloaded LLVM file is not a valid XZ archive!"
                echo "Using system clang as last resort..."
                mkdir -p clang/bin
                sudo apt-get update
                sudo apt-get install -y clang-18 lld-18
                # Create symlinks to make it look like a regular toolchain
                ln -s /usr/bin/clang-18 clang/bin/clang
                ln -s /usr/bin/clang++-18 clang/bin/clang++
                ln -s /usr/bin/ld.lld-18 clang/bin/ld.lld
                ln -s /usr/bin/llvm-ar-18 clang/bin/llvm-ar
                ln -s /usr/bin/llvm-nm-18 clang/bin/llvm-nm
                ln -s /usr/bin/llvm-objdump-18 clang/bin/llvm-objdump
                ln -s /usr/bin/llvm-strip-18 clang/bin/llvm-strip
              fi
            else
              echo "Fallback download also failed. Using system clang..."
              mkdir -p clang/bin
              sudo apt-get update
              sudo apt-get install -y clang-18 lld-18
              # Create symlinks
              ln -s /usr/bin/clang-18 clang/bin/clang
              ln -s /usr/bin/clang++-18 clang/bin/clang++
              ln -s /usr/bin/ld.lld-18 clang/bin/ld.lld
              ln -s /usr/bin/llvm-ar-18 clang/bin/llvm-ar
              ln -s /usr/bin/llvm-nm-18 clang/bin/llvm-nm
              ln -s /usr/bin/llvm-objdump-18 clang/bin/llvm-objdump
              ln -s /usr/bin/llvm-strip-18 clang/bin/llvm-strip
            fi
          fi
          
          echo "Setting executable permissions..."
          chmod +x clang/bin/* 2>/dev/null || true

      - name: Set up Environment
        run: |
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "LD=$CLANG_BIN/ld.lld" >> $GITHUB_ENV
          echo "AR=$CLANG_BIN/llvm-ar" >> $GITHUB_ENV
          echo "NM=$CLANG_BIN/llvm-nm" >> $GITHUB_ENV
          echo "OBJDUMP=$CLANG_BIN/llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=$CLANG_BIN/llvm-strip" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Set up GCC Cross-Compiler
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
          echo "$GITHUB_WORKSPACE/gcc/bin" >> $GITHUB_PATH

      - name: Clone and Set Up KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ inputs.kernelsu_version }}
          echo 'Appending KernelSU config to defconfig...'
          tee -a arch/arm64/configs/n200_defconfig > /dev/null <<EOF
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KERNELSU=y
          CONFIG_KERNELSU_MODULE_SEPARATED=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_ELFCORE=y
          CONFIG_PROC_FS=y
          CONFIG_TMPFS=y
          EOF

      - name: Fix Missing LLVM Tools
        run: |
          # Install system LLVM tools as fallback  
          sudo apt-get update
          sudo apt-get install -y llvm-18-tools
          
          # Create missing symlinks in your clang directory
          cd toolchain/linux-x86/clang/bin
          
          # Check and create missing tools
          if [ ! -f llvm-objcopy ]; then
            echo "Creating llvm-objcopy symlink..."
            ln -sf /usr/bin/llvm-objcopy-18 llvm-objcopy
          fi
          
          if [ ! -f llvm-readelf ]; then
            echo "Creating llvm-readelf symlink..."
            ln -sf /usr/bin/llvm-readelf-18 llvm-readelf
          fi
          
          if [ ! -f llvm-addr2line ]; then
            echo "Creating llvm-addr2line symlink..."
            ln -sf /usr/bin/llvm-addr2line-18 llvm-addr2line
          fi
          
          if [ ! -f llvm-size ]; then
            echo "Creating llvm-size symlink..."
            ln -sf /usr/bin/llvm-size-18 llvm-size
          fi
          
          # Test the problematic tool
          echo "Testing llvm-objcopy..."
          ./llvm-objcopy --version || echo "llvm-objcopy test failed"
          
          # List all tools
          echo "Available tools:"
          ls -la llvm-*

      - name: Update Environment Variables
        run: |
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin
          echo "OBJCOPY=$CLANG_BIN/llvm-objcopy" >> $GITHUB_ENV
          echo "READELF=$CLANG_BIN/llvm-readelf" >> $GITHUB_ENV

      - name: Debug Build System
        run: |
          echo "=== Checking defconfig ==="
          grep -i sensor arch/arm64/configs/n200_defconfig || echo "No sensor configs found"
          
          echo "=== Searching for sensor driver files ==="
          find . -name "*sensor*" -type f | grep -E '\.(c|h)$' | head -10 || echo "No sensor files found"
          
          echo "=== Checking if oplus_sensor_devinfo is being built ==="
          find . -name "Makefile*" -exec grep -H "oplus_sensor_devinfo" {} \; 2>/dev/null || echo "Not found in Makefiles"

      - name: Remove Problematic Object from Build
        run: |
          echo "Searching for and removing oplus_sensor_devinfo from build..."
          
          # Find all Makefiles that might build this driver
          echo "Searching for Makefiles containing oplus_sensor_devinfo..."
          find . -name "Makefile*" -type f | xargs grep -l "oplus_sensor_devinfo" 2>/dev/null || true
          
          # Comment out the driver in Makefiles
          echo "Commenting out driver in Makefiles..."
          find . -name "Makefile*" -type f -exec sed -i 's/.*oplus_sensor_devinfo.*/#&/' {} \; 2>/dev/null || true
          
          # Also try to find it in the soc/oplus directory specifically
          if [ -d "soc/oplus" ]; then
            echo "Found soc/oplus directory, searching for Makefiles..."
            find soc/oplus -name "Makefile*" -type f | xargs cat 2>/dev/null || true
            find soc/oplus -name "Makefile*" -type f -exec sed -i 's/.*sensor.*/#&/' {} \; 2>/dev/null || true
          fi
          
          # Rename the source file to prevent it from being found
          if [ -f "soc/oplus/sensor/oplus_sensor_devinfo.c" ]; then
            echo "Renaming problematic source file..."
            mv soc/oplus/sensor/oplus_sensor_devinfo.c soc/oplus/sensor/oplus_sensor_devinfo.c.disabled
          fi
          
          # Remove any sensor devinfo related files
          find . -name "*sensor_devinfo*" -type f -exec echo "Found: {}" \;
          find . -name "*sensor_devinfo*" -type f -exec rm -f {} \; 2>/dev/null || true
          
          echo "Removed oplus_sensor_devinfo from build system"

      - name: Fix Kernel Configuration
        run: |
          echo "Fixing missing symbol dependencies..."
          
          # Clean the config first
          make O=out mrproper 2>/dev/null || true
          
          # Add missing Qualcomm SMEM configuration and disable problematic drivers
          cat << 'EOF' >> arch/arm64/configs/n200_defconfig
          # Fix missing symbols
          CONFIG_QCOM_SMEM=y
          # Explicitly disable problematic drivers
          # CONFIG_OPLUS_SENSOR_DEVINFO is not set
          # CONFIG_OPLUS_SENSOR is not set
          # CONFIG_OPLUS_FEATURE_SENSOR_DRIVER is not set
          # CONFIG_OPLUS_FEATURE_SENSOR_SMEM is not set
          EOF
          
          echo "Updated defconfig with missing dependencies"

      - name: Build Kernel
        run: |
          echo "Building kernel configuration..."
          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=$CLANG_BIN/clang \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            n200_defconfig
          
          echo "Building kernel image..."
          make O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=$CLANG_BIN/clang \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            OBJCOPY=$CLANG_BIN/llvm-objcopy \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc)

      - name: Check Build Output
        run: |
          ls -la out/arch/arm64/boot/
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel build successful!"
            echo "Image size: $(stat -c%s out/arch/arm64/boot/Image) bytes"
          else
            echo "❌ Kernel build failed - Image not found"
            exit 1
          fi

      - name: Download Stock Boot Image
        run: |
          echo "Downloading stock boot image..."
          wget -O stock_boot.img "${{ inputs.stock_boot_url }}"
          ls -la stock_boot.img

      - name: Install AIK (Android Image Kitchen)
        run: |
          echo "Installing Android Image Kitchen..."
          wget https://github.com/osm0sis/AIK-Linux/archive/master.zip
          unzip -q master.zip
          mv AIK-Linux-master AIK
          chmod +x AIK/*.sh

      - name: Unpack and Repack Boot Image
        run: |
          echo "Unpacking stock boot image..."
          cd AIK
          ./unpackimg.sh ../stock_boot.img
          
          echo "Replacing kernel..."
          cp ../out/arch/arm64/boot/Image split_img/stock_boot.img-kernel
          
          echo "Repacking boot image..."
          ./repackimg.sh
          
          echo "Moving final image..."
          mv image-new.img ../kernelsu_boot.img
          
          echo "✅ Boot image repacked successfully!"
          ls -la ../kernelsu_boot.img

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-build-${{ inputs.kernelsu_version }}-${{ github.run_number }}
          path: |
            out/arch/arm64/boot/Image
            kernelsu_boot.img
            out/.config
          retention-days: 30

      - name: Create Release Summary
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **KernelSU Version:** ${{ inputs.kernelsu_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Image Size:** $(stat -c%s out/arch/arm64/boot/Image) bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **Boot Image Size:** $(stat -c%s kernelsu_boot.img) bytes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- \`Image\` - Raw kernel image" >> $GITHUB_STEP_SUMMARY
          echo "- \`kernelsu_boot.img\` - Ready-to-flash boot image" >> $GITHUB_STEP_SUMMARY
          echo "- \`.config\` - Kernel configuration used" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Installation" >> $GITHUB_STEP_SUMMARY
          echo "Flash \`kernelsu_boot.img\` to your boot partition:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "fastboot flash boot kernelsu_boot.img" >> $GITHUB_STEP_SUMMARY
          echo "fastboot reboot" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Create Release (Optional)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernelsu-${{ inputs.kernelsu_version }}-${{ github.run_number }}
          name: KernelSU Build ${{ inputs.kernelsu_version }}
          body: |
            ## KernelSU Kernel Build
            
            **KernelSU Version:** ${{ inputs.kernelsu_version }}
            **Build Date:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ### Files:
            - `Image`: Raw kernel image
            - `kernelsu_boot.img`: Repacked boot image ready to flash
            - `.config`: Kernel configuration used
            
            ### Installation:
            Flash `kernelsu_boot.img` to your boot partition using fastboot or recovery.
            
          files: |
            out/arch/arm64/boot/Image
            kernelsu_boot.img
            out/.config
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}