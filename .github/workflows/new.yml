name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential cpio curl flex git libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils

    
    name: Build with Cached Toolchain

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Clang Toolchain  Cache 🛠️
        id: cache-clang # Give the step an ID to check its output
        uses: actions/cache@v4
        with:
          # The path to the directory to cache
          path: toolchain/linux-x86
          # The key to identify the cache. Changing the tag will create a new cache.
          key: ${{ runner.os }}-clang-android-14.0.0_r50

      - name: Download Clang Toolchain (if not cached)
        # This step only runs if the cache step did NOT find a match
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-14.0.0_r50 toolchain/linux-x86 --depth=1

      - name: Verify Toolchain
        run: |
          echo "Toolchain binaries:"
          ls toolchain/linux-x86/bin


        
        # Download mkbootimg
        echo "Setting up mkbootimg..."
        git clone --depth=1 https://github.com/osm0sis/mkbootimg.git tools/mkbootimg
        
        # Create unpack_bootimg script
        mkdir -p tools/unpack_bootimg
        cat > tools/unpack_bootimg/unpack_bootimg.py << 'EOF'

    - name: Clone KernelSU
      run: |
        git clone --depth=1 --branch ${{ github.event.inputs.kernelsu_version }} https://github.com/KernelSU/KernelSU.git kernelsu
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_KERNELSU=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_KERNELSU_MODULE_SEPARATED=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_ELFCORE=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_PROC_FS=y" >> arch/arm64/configs/n200_defconfig
        echo "CONFIG_TMPFS=y" >> arch/arm64/configs/n200_defconfig

    - name: Apply KernelSU patch
      run: |
        cd kernelsu
        ./setup.sh ../

    - name: Build kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/clang-llvm/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        make O=out n200_defconfig
        make -j$(nproc) O=out CC=clang LLVM=1

    - name: Download stock boot image
      run: |
        mkdir stock
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock/boot.img

    - name: Clone mkbootimg
      run: git clone --depth=1 https://github.com/osm0sis/mkbootimg.git tools/mkbootimg

    - name: Add unpack_bootimg.py
      run: |
        mkdir -p tools/unpack_bootimg
        cat > tools/unpack_bootimg/unpack_bootimg.py << 'EOF'
        #!/usr/bin/env python3
        import os, sys, struct

        def unpack_boot_img(boot_img_path, out_dir):
            os.makedirs(out_dir, exist_ok=True)
            with open(boot_img_path, 'rb') as f:
                magic = f.read(8)
                if magic != b'ANDROID!':
                    print("Not a valid Android boot image.", file=sys.stderr)
                    return False
                # Minimal stub (replace with full parser for real use)
                with open(os.path.join(out_dir, 'stub_notice.txt'), 'w') as note:
                    note.write("This is a placeholder unpack. Please replace with full parser.")
                return True

        if __name__ == '__main__':
            if len(sys.argv) != 3:
                print(f"Usage: {sys.argv[0]} boot.img output_dir")
                sys.exit(1)
            unpack_boot_img(sys.argv[1], sys.argv[2])
        EOF
        chmod +x tools/unpack_bootimg/unpack_bootimg.py

    - name: Unpack boot.img
      run: |
        mkdir extracted
        python3 tools/unpack_bootimg/unpack_bootimg.py stock/boot.img extracted

    - name: Replace kernel image
      run: |
        cp out/arch/arm64/boot/Image extracted/Image

    - name: Repack boot image
      run: |
        tools/mkbootimg/mkbootimg.py \
          --kernel extracted/Image \
          --ramdisk extracted/ramdisk \
          --base 0x00000000 \
          --pagesize 4096 \
          --output new-boot.img

    - name: Upload boot.img
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-Boot-Image
        path: new-boot.img