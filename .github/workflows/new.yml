# A more descriptive name for the workflow
name: Build KernelSU Kernel and Create Flashable Zip

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      # NOTE: Removed stock_boot_url as it was unused. AnyKernel3 patches the
      # boot image on the device itself, it does not need a stock image during build.

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Environment variables for ccache
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    # Step 1: Checkout your kernel source repository
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # Step 2: Set up the Clang Toolchain
    - name: Cache Clang Toolchain
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: toolchain/linux-x86/clang-r450784d
        # Use a versioned key to ensure the correct content is cached
        key: clang-r450784d-v2

    - name: Download Clang Toolchain
      if: steps.clang-cache.outputs.cache-hit != 'true'
      run: |
        set -e # Exit immediately on any error
        echo "Downloading Clang 14 prebuilts from AOSP Git..."
        TOOLCHAIN_DIR="toolchain/linux-x86"
        CLANG_REVISION="clang-r450784d"
        CLANG_REPO_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
        
        mkdir -p "${TOOLCHAIN_DIR}"
        
        # FIX: Use a sparse git checkout. This is the correct and efficient method
        # to download a specific subdirectory from the large AOSP repository.
        git clone \
          --branch main \
          --depth=1 \
          --filter=blob:none \
          --no-checkout \
          "${CLANG_REPO_URL}" "_temp_clang_clone"
          
        cd _temp_clang_clone
        git sparse-checkout set "${CLANG_REVISION}"
        git checkout
        cd ..
        
        # Move the downloaded toolchain to its final location and clean up the temp clone
        mv "_temp_clang_clone/${CLANG_REVISION}" "${TOOLCHAIN_DIR}/${CLANG_REVISION}"
        rm -rf _temp_clang_clone
        
        echo "✅ Clang toolchain ${CLANG_REVISION} downloaded successfully."

    # Step 3: Set up KernelSU Source
    - name: Cache KernelSU Source
      id: kernelsu-cache
      uses: actions/cache@v4
      with:
        path: KernelSU
        key: kernelsu-${{ github.event.inputs.kernelsu_version }}

    - name: Download KernelSU Source
      if: steps.kernelsu-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading KernelSU ${{ github.event.inputs.kernelsu_version }}..."
        git clone --depth=1 --branch ${{ github.event.inputs.kernelsu_version }} \
          https://github.com/tiann/KernelSU.git KernelSU
        echo "✅ KernelSU downloaded successfully"

    # Step 4: Install System Dependencies
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential cpio curl flex git \
          libssl-dev libelf-dev libncurses-dev python3 \
          unzip xz-utils lld wget file zip

    # Step 5: Configure the Build Environment
    - name: Setup Build Environment
      run: |
        echo "Setting up environment variables..."
        # Add the downloaded Clang toolchain's bin directory to the system PATH
        echo "$GITHUB_WORKSPACE/toolchain/linux-x86/clang-r450784d/bin" >> $GITHUB_PATH
        
        # Set Kbuild environment variables for an ARM64 Clang (LLVM) build
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "✅ Environment configured."

    # Step 6: Integrate KernelSU and Apply Kernel-Specific Patches
    - name: Integrate KernelSU and Apply Patches
      run: |
        set -euo pipefail
        echo "Integrating KernelSU..."
        # FIX: Use the setup script from the *locally cloned* KernelSU version.
        # This ensures compatibility between the script and the source code.
        # This script also correctly patches the defconfig, so the manual patch is removed.
        bash KernelSU/kernel/setup.sh

        echo "Applying kernel-specific workarounds for n200..."
        # This stub is required to fix build errors related to missing symbols
        # (qcom_smem_get, get_project) in this specific kernel source.
        mkdir -p drivers/misc
        cat > drivers/misc/oplus_stubs.c <<'EOC'
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/errno.h>

        void *qcom_smem_get(unsigned host, unsigned item, size_t *size) {
            pr_err("STUB: qcom_smem_get called\n");
            if (size) *size = 0;
            return ERR_PTR(-ENOENT);
        }
        EXPORT_SYMBOL(qcom_smem_get);

        int get_project(void) {
            pr_warn("STUB: get_project called, returning default\n");
            return 21000;
        }
        EXPORT_SYMBOL(get_project);
        EOC
        echo "obj-y += oplus_stubs.o" >> drivers/misc/Makefile
        echo "✅ Integration and patching complete."

    # Step 7: Build the Kernel
    - name: Build Kernel
      run: |
        make O=out n200_defconfig
        make -j$(nproc) O=out

    # Step 8: Package into a Flashable Zip using AnyKernel3
    - name: Package with AnyKernel3
      run: |
        echo "Cloning AnyKernel3 template..."
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        
        echo "Copying compiled kernel image to AnyKernel3 directory..."
        cp out/arch/arm64/boot/Image AnyKernel3/
        
        echo "Creating flashable zip..."
        cd AnyKernel3
        # Create a zip archive, excluding the .git directory for a cleaner package
        zip -r9 ../KernelSU-n200-${{ github.event.inputs.kernelsu_version }}.zip ./* -x ".git/*"
        cd ..
        echo "✅ Flashable zip created."

    # Step 9: Upload the Flashable Zip as an Artifact
    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        # Use a more descriptive artifact name
        name: KernelSU-n200-${{ github.event.inputs.kernelsu_version }}
        path: KernelSU-n200-${{ github.event.inputs.kernelsu_version }}.zip

