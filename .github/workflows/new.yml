name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/example/stock_boot.img'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # -----------------
    # Cache Clang
    # -----------------
    - name: Cache Clang Toolchain
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: clang
        key: clang-aosp-14.0.6

    - name: Download Clang Toolchain
      if: steps.clang-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading Clang from Google's AOSP mirror..."
        mkdir -p clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.gz
        tar -C clang -xzf clang-r450784d.tar.gz
        rm clang-r450784d.tar.gz

    # -----------------
    # Cache KernelSU
    # -----------------
    - name: Cache KernelSU
      id: kernelsu-cache
      uses: actions/cache@v4
      with:
        path: KernelSU
        key: kernelsu-${{ github.event.inputs.kernelsu_version }}

    - name: Download KernelSU
      if: steps.kernelsu-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading KernelSU ${{ github.event.inputs.kernelsu_version }}..."
        git clone --depth=1 --branch ${{ github.event.inputs.kernelsu_version }} \
          https://github.com/tiann/KernelSU.git KernelSU
        echo "✅ KernelSU downloaded successfully"

    # -----------------
    # Build Kernel
    # -----------------
    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make O=out ARCH=arm64 vendor/holi_defconfig
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    # -----------------
    # Download Stock Boot Image
    # -----------------
    - name: Cache Stock Boot Image
      id: boot-cache
      uses: actions/cache@v4
      with:
        path: stock_boot.img
        key: stockboot-${{ github.event.inputs.stock_boot_url }}

    - name: Download Stock Boot
      if: steps.boot-cache.outputs.cache-hit != 'true'
      run: |
        curl -L ${{ github.event.inputs.stock_boot_url }} -o stock_boot.img

    # -----------------
    # Repack with AnyKernel3
    # -----------------
    - name: Repack Boot Image
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU_kernel.zip *
        cd ..
        echo "✅ Repacked KernelSU kernel zip created"

    # -----------------
    # Upload Build Artifacts
    # -----------------
    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU_kernel
        path: KernelSU_kernel.zip