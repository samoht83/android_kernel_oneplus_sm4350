name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/example/boot.img'
        type: string

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: "3G"

    steps:
    # Checkout your kernel source
    - uses: actions/checkout@v4

    # Free disk space before starting
    - name: Free up disk space
      run: |
        echo "Cleaning up preinstalled software to free space..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean
        docker system prune -af || true
        df -h

    # Install required packages
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev make gcc clang lld ccache curl unzip

    # Download Clang toolchain
    - name: Download Clang Toolchain
      run: |
        mkdir -p ~/toolchain
        curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.gz \
          | tar -xz -C ~/toolchain
        echo "$HOME/toolchain/clang-r450784d/bin" >> $GITHUB_PATH

    # Download KernelSU
    - name: Download KernelSU
      run: |
        git clone --depth=1 --branch ${{ github.event.inputs.kernelsu_version }} https://github.com/tiann/KernelSU.git kernelsu
        cp -r kernelsu/kernel/* .

    # Prepare defconfig
    - name: Set defconfig
      run: |
        make O=out ARCH=arm64 vendor/holi_defconfig

    # Build kernel
    - name: Build kernel
      run: |
        make -j$(nproc) O=out ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1

    # Download stock boot.img to /tmp (not workspace)
    - name: Download stock boot.img
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o /tmp/boot.img

    # Unpack & repack boot.img with new kernel
    - name: Repack boot.img
      run: |
        git clone https://github.com/osm0sis/mkbootimg.git mkbootimg
        git clone https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        cd anykernel
        zip -r9 ../KernelSU-${{ github.event.inputs.kernelsu_version }}.zip .

    # Upload artifact
    - uses: actions/upload-artifact@v4
      with:
        name: KernelSU-${{ github.event.inputs.kernelsu_version }}
        path: KernelSU-${{ github.event.inputs.kernelsu_version }}.zip

    # Final cleanup
    - name: Cleanup to avoid space issues
      run: |
        rm -rf out/* kernelsu mkbootimg anykernel ~/toolchain /tmp/*
        df -h