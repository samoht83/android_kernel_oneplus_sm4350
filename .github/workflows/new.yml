name: Build KernelSU and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/username/repo/releases/download/tag/boot.img'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    # Cache Clang
    - name: Cache Clang Toolchain
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: toolchain/linux-x86/clang-r450784d
        key: clang-r450784d

    - name: Download Clang Toolchain
      if: steps.clang-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading Clang 14 prebuilts..."
        mkdir -p toolchain/linux-x86/clang-r450784d
        
        # Use a reliable mirror for AOSP clang
        CLANG_URL="https://github.com/kdrag0n/proton-clang/releases/download/20220811/proton-clang-20220811.tar.xz"
        
        echo "Downloading from reliable mirror..."
        curl -fSL --connect-timeout 30 --retry 3 --retry-delay 5 \
          "$CLANG_URL" -o clang.tar.xz
        
        tar -xf clang.tar.xz --strip-components=1 -C toolchain/linux-x86/clang-r450784d
        rm clang.tar.xz
        
        # Verify clang was extracted
        if [ -f "toolchain/linux-x86/clang-r450784d/bin/clang" ]; then
          echo "✅ Clang extracted successfully"
          toolchain/linux-x86/clang-r450784d/bin/clang --version
        else
          echo "❌ Clang extraction failed"
          exit 1
        fi

    # Cache KernelSU
    - name: Cache KernelSU
      id: kernelsu-cache
      uses: actions/cache@v4
      with:
        path: KernelSU
        key: kernelsu-${{ github.event.inputs.kernelsu_version }}

    - name: Download KernelSU
      if: steps.kernelsu-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading KernelSU ${{ github.event.inputs.kernelsu_version }}..."
        git clone --depth=1 --branch ${{ github.event.inputs.kernelsu_version }} \
          https://github.com/tiann/KernelSU.git KernelSU
        echo "✅ KernelSU downloaded successfully"

    # Install dependencies
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential cpio curl flex git \
          libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils lld \
          wget file llvm-18-tools zip

    # Set environment variables
    - name: Setup environment variables
      run: |
        echo "$GITHUB_WORKSPACE/toolchain/linux-x86/clang-r450784d/bin" >> $GITHUB_PATH
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

    # Integrate KernelSU & patch config
    - name: Integrate KernelSU and patch defconfig
      run: |
        set -euo pipefail
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ github.event.inputs.kernelsu_version }}"
        cat >> arch/arm64/configs/n200_defconfig <<'EOF'
        # KernelSU Requirements
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_OVERLAY_FS=y
        CONFIG_KERNELSU=y
        # Patch for build errors
        # CONFIG_RMNET is not set
        EOF
        mkdir -p drivers/misc
        cat > drivers/misc/oplus_stubs.c <<'EOC'
        #include <linux/module.h>
        #include <linux/kernel.h>
        #include <linux/errno.h>

        void *qcom_smem_get(unsigned host, unsigned item, size_t *size) {
            pr_err("STUB: qcom_smem_get called\n");
            if (size) *size = 0;
            return ERR_PTR(-ENOENT);
        }
        EXPORT_SYMBOL(qcom_smem_get);

        int get_project(void) {
            pr_warn("STUB: get_project called, returning default\n");
            return 21000;
        }
        EXPORT_SYMBOL(get_project);
        EOC
        echo "obj-y += oplus_stubs.o" >> drivers/misc/Makefile

    # Build Kernel
    - name: Build Kernel
      run: |
        make O=out n200_defconfig
        make -j$(nproc) O=out

    # Cache stock boot.img
    - name: Cache Stock Boot Image
      id: stockboot-cache
      uses: actions/cache@v4
      with:
        path: stock_boot.img
        key: stockboot-${{ hashFiles(github.event.inputs.stock_boot_url) }}

    - name: Download Stock Boot Image
      if: steps.stockboot-cache.outputs.cache-hit != 'true'
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

    # Repack boot image with AnyKernel3
    - name: Repack Boot Image with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        cp out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU_kernel.zip ./*
        cd ..

    # Upload flashable zip artifact
    - name: Upload KernelSU Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU_kernel
        path: KernelSU_kernel.zip