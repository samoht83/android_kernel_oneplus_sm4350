name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: samoht83/android_kernel_oneplus_sm4350
          ref: lineage-22.2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl unzip bc bison flex build-essential \
            libncurses5-dev libssl-dev ccache xz-utils python3 python3-pip

      - name: Setup ccache
        run: |
          echo "max_size = 10G" >> ~/.ccache/ccache.conf
          ccache -M 10G
          ccache -s

      - name: Download Clang 14 Toolchain
        run: |
          mkdir -p ~/toolchain
          cd ~/toolchain
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784e.tar.xz
          tar -xf clang-r450784e.tar.xz
          echo "$HOME/toolchain/clang-r450784e/bin" >> $GITHUB_PATH

      - name: Clone KernelSU
        run: |
          git clone --depth=1 --branch v0.9.5 https://github.com/tiann/KernelSU.git kernelsu
          cd kernelsu
          ./setup.sh ../

      - name: Build Kernel
        run: |
          export PATH=$HOME/toolchain/clang-r450784e/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export USE_CCACHE=1
          export CCACHE_DIR=$HOME/.ccache
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out vendor/holi-qgki_defconfig
          make -j$(nproc) O=out

      - name: Download Stock Boot Image
        run: |
          mkdir -p stock_boot
          wget -O stock_boot/original_boot.img https://github.com/samoht83/android_kernel_oneplus_sm4350/raw/700c84fe28425cd8d4925d27eda34095a52554e5/stock/original_boot.img

      - name: Unpack, Repack, and Patch Boot Image
        run: |
          git clone https://github.com/topjohnwu/magiskboot.git
          cd magiskboot
          make
          cd ..
          ./magiskboot/magiskboot unpack stock_boot/original_boot.img
          cp out/arch/arm64/boot/Image.gz-dtb kernel
          ./magiskboot/magiskboot repack stock_boot/original_boot.img

      - name: Upload Patched Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: patched_boot.img
          path: new-boot.img