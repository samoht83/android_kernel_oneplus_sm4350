name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/username/repo/releases/download/tag/boot.img'
        type: string

jobs:
  build:
    name: Build by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
    - uses: actions/checkout@v4

    # Cache Clang Toolchain
    - name: Cache Clang Toolchain
      id: clang-cache
      uses: actions/cache@v4
      with:
        path: toolchain/linux-x86/clang
        key: clang-r450784d

    - name: Download Clang Toolchain
      if: steps.clang-cache.outputs.cache-hit != 'true'
      run: |
        echo "Downloading Clang from Google's AOSP mirror..."
        mkdir -p toolchain/linux-x86/clang
        curl -fSL --connect-timeout 30 --retry 3 --retry-delay 5 \
          "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.gz" \
          | tar -xz -C toolchain/linux-x86/clang
        echo "✅ Clang extracted successfully"

    # Cache KernelSU
    - name: Cache KernelSU Source
      id: kernelsu-cache
      uses: actions/cache@v4
      with:
        path: KernelSU
        key: kernelsu-${{ github.event.inputs.kernelsu_version }}

    - name: Download KernelSU
      if: steps.kernelsu-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cloning KernelSU ${{ github.event.inputs.kernelsu_version }}..."
        git clone --depth=1 --branch "${{ github.event.inputs.kernelsu_version }}" \
          https://github.com/tiann/KernelSU.git KernelSU
        echo "✅ KernelSU cloned successfully"

    # Prepare environment
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libncurses-dev flex bison libssl-dev \
          lz4 wget git python3 unzip curl axel tar

    # Build Kernel
    - name: Build Kernel with KernelSU
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        make O=out vendor/holi-qgki_defconfig
        echo "Applying KernelSU..."
        cp -r KernelSU/* .
        make O=out -j$(nproc)

    # Download stock boot.img
    - name: Download Stock Boot
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

    # Unpack and Repack Boot Image
    - name: Repack Boot with New Kernel
      run: |
        git clone https://github.com/osm0sis/mkbootimg.git
        mkdir repack
        python3 mkbootimg/unpackbootimg.py --boot_img stock_boot.img --out repack
        cp out/arch/arm64/boot/Image.gz-dtb repack/kernel
        python3 mkbootimg/mkbootimg.py $(cat repack/unpack_info.txt) \
          --kernel repack/kernel -o new_boot.img

    # Upload Result
    - name: Upload New Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: new_boot.img
        path: new_boot.img