#
# Complete GitHub Actions Workflow
# Builds a Kernel with KernelSU and Repacks a Stock Boot Image
#
name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/samoht83/android_kernel_oneplus_sm4350/blob/lineage-22.2/stock/original_boot.img?raw=true'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils lld

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/linux-x86/clang-r510928
          key: ${{ runner.os }}-clang-r510928

      - name: Download and Extract Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain/linux-x86
          cd toolchain/linux-x86
          
          # This is the primary URL for the toolchain from your original workflow
          PRIMARY_URL="https://github.com/Its-Vichy/prebuilt-linux-x86-clang/releases/download/510928/clang-r510928.tar.gz"
          
          # This is the corrected fallback URL for the official LLVM 18.1.8 toolchain
          # It now points to the ubuntu-22.04 version, which is compatible with the runner
          FALLBACK_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz"

          echo "Attempting to download from primary URL..."
          if wget --spider "$PRIMARY_URL" 2>/dev/null; then
            echo "Primary URL is available. Downloading..."
            wget -qO- "$PRIMARY_URL" | tar -xz
          else
            echo "Primary URL failed. Using official LLVM release as a fallback..."
            wget -qO- "$FALLBACK_URL" | tar -xJ
            # The extracted folder has a long name, so we rename it to 'clang-r510928' for consistency
            mv clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04 clang-r510928
          fi
          
          echo "Setting executable permissions..."
          chmod +x clang-r510928/bin/*
      
      # NOTE: The 'actions/cache/save' step is now part of 'actions/cache@v4'
      # and is handled automatically post-job. No separate save step is needed.

      - name: Set up Environment
        run: |
          CLANG_BIN=$GITHUB_WORKSPACE/toolchain/linux-x86/clang-r510928/bin
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "LD=$CLANG_BIN/ld.lld" >> $GITHUB_ENV
          echo "AR=$CLANG_BIN/llvm-ar" >> $GITHUB_ENV
          echo "NM=$CLANG_BIN/llvm-nm" >> $GITHUB_ENV
          echo "OBJDUMP=$CLANG_BIN/llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=$CLANG_BIN/llvm-strip" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Set up GCC Cross-Compiler
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc
          echo "$GITHUB_WORKSPACE/gcc/bin" >> $GITHUB_PATH

      - name: Clone and Set Up KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ inputs.kernelsu_version }}
          echo 'Appending KernelSU config to defconfig...'
          tee -a arch/arm64/configs/n200_defconfig > /dev/null <<EOF
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KERNELSU=y
          CONFIG_KERNELSU_MODULE_SEPARATED=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_ELFCORE=y
          CONFIG_PROC_FS=y
          CONFIG_TMPFS=y
          EOF

      - name: Build Kernel
        run: |
          make O=out \
            LLVM=1 LLVM_IAS=1 \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip \
            n200_defconfig
          make -j$(nproc) O=out \
            LLVM=1 LLVM_IAS=1 \
            LD=$CLANG_BIN/ld.lld \
            AR=$CLANG_BIN/llvm-ar \
            NM=$CLANG_BIN/llvm-nm \
            OBJDUMP=$CLANG_BIN/llvm-objdump \
            STRIP=$CLANG_BIN/llvm-strip

      - name: Download Stock Boot Image
        run: |
          mkdir stock
          curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock/boot.img

      - name: Install MagiskBoot
        run: |
          curl -LO https://raw.githubusercontent.com/topjohnwu/magisk-files/main/tools/magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/

      - name: Unpack stock boot.img using MagiskBoot
        run: |
          mkdir extracted
          cd extracted
          magiskboot unpack ../stock/boot.img

      - name: Replace kernel with built Image
        run: |
          cp ../out/arch/arm64/boot/Image ./kernel

      - name: Repack boot.img using original parameters
        run: |
          cd extracted
          magiskboot repack ../stock/boot.img
          mv new-boot.img ../new-boot.img

      - name: Upload Repacked Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Boot-Image
          path: new-boot.img
