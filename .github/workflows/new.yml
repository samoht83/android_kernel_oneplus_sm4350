name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://github.com/samoht83/android_kernel_oneplus_sm4350/blob/lineage-22.2/stock/original_boot.img?raw=true'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git libssl-dev libelf-dev libncurses-dev python3 unzip xz-utils lld wget file llvm-18-tools

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: toolchain/linux-x86/clang
          key: ${{ runner.os }}-clang-18.1.8-v1
          restore-keys: |
            ${{ runner.os }}-clang-18.1.8-

      - name: Download and Extract Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
mkdir -p toolchain/linux-x86

# Official LLVM release URL
CLANG_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-22.04.tar.xz"

echo "Downloading Clang toolchain..."
if wget --timeout=30 --tries=3 -q "$CLANG_URL" -O clang.tar.xz 2>/dev/null; then
  echo "Downloaded with wget successfully"
elif curl -L --connect-timeout 30 --retry 3 --retry-delay 5 -o clang.tar.xz "$CLANG_URL" 2>/dev/null; then
  echo "Downloaded with curl successfully"
else
  echo "Official download failed, trying alternative method..."
  sudo apt-get update
  sudo apt-get install -y clang-18 lld-18
  mkdir -p toolchain/linux-x86/clang/bin
  ln -sf /usr/bin/clang-18         toolchain/linux-x86/clang/bin/clang
  ln -sf /usr/bin/clang++-18       toolchain/linux-x86/clang/bin/clang++
  ln -sf /usr/bin/ld.lld-18        toolchain/linux-x86/clang/bin/ld.lld
  ln -sf /usr/bin/llvm-ar-18       toolchain/linux-x86/clang/bin/llvm-ar
  ln -sf /usr/bin/llvm-nm-18       toolchain/linux-x86/clang/bin/llvm-nm
  ln -sf /usr/bin/llvm-strip-18    toolchain/linux-x86/clang/bin/llvm-strip
  ln -sf /usr/bin/llvm-objcopy-18  toolchain/linux-x86/clang/bin/llvm-objcopy
  ln -sf /usr/bin/llvm-objdump-18  toolchain/linux-x86/clang/bin/llvm-objdump
  echo "Using system clang-18 as fallback"
  exit 0
fi

# Verify download
if [ ! -s clang.tar.xz ]; then
  echo "Error: Failed to download clang toolchain or file is empty"
  exit 1
fi

echo "Extracting toolchain..."
mkdir -p toolchain/linux-x86/clang
tar -xf clang.tar.xz --strip-components=1 -C toolchain/linux-x86/clang
rm clang.tar.xz

# Verify extraction
if [ ! -x "toolchain/linux-x86/clang/bin/clang" ]; then
  echo "Error: Clang toolchain extraction failed"
  exit 1
fi

echo "Clang toolchain setup complete"

      - name: Set up Environment Variables
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/toolchain/linux-x86/clang/bin" >> $GITHUB_PATH
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Set up GCC Cross-Compilers
        shell: bash
        run: |
          # 64-bit toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          # 32-bit toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH
          echo "CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV

      - name: Integrate KernelSU and Apply Patches
        shell: bash
        run: |
          set -euo pipefail

          # Integrate KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${{ inputs.kernelsu_version }}"

          # Append required configs to defconfig
          cat >> arch/arm64/configs/n200_defconfig << 'EOF'
          # KernelSU Requirements
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KERNELSU=y
          # Patches for build errors
          # CONFIG_RMNET is not set
          EOF

          # Create stubs for missing symbols to prevent linker errors
          mkdir -p drivers/misc
          cat > drivers/misc/oplus_stubs.c << 'EOC'
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/errno.h>

          void *qcom_smem_get(unsigned host, unsigned item, size_t *size) {
              pr_err("STUB: qcom_smem_get called\n");
              if (size) *size = 0;
              return ERR_PTR(-ENOENT);
          }
          EXPORT_SYMBOL(qcom_smem_get);

          int get_project(void) {
              pr_warn("STUB: get_project called, returning default\n");
              return 21000;
          }
          EXPORT_SYMBOL(get_project);
          EOC

          # Add the stub object to the build
          echo "obj-y += oplus_stubs.o" >> drivers/misc/Makefile

      - name: Build Kernel
        shell: bash
        run: |
          set -euo pipefail
          make O=out n200_defconfig
          make -j"$(nproc)" O=out

      - name: Check Build Output
        shell: bash
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✅ Kernel build successful!"
            ls -la out/arch/arm64/boot/
          else
            echo "❌ Kernel build failed - Image not found."
            exit 1
          fi

      - name: Download Stock Boot Image and AIK
        shell: bash
        run: |
          wget -O stock_boot.img "${{ inputs.stock_boot_url }}"
          wget -q https://github.com/osm0sis/AIK-Linux/archive/master.zip -O AIK.zip
          unzip -q AIK.zip
          mv AIK-Linux-master AIK
          chmod +x AIK/*.sh

      - name: Repack Boot Image with New Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd AIK
          ./unpackimg.sh ../stock_boot.img
          cp ../out/arch/arm64/boot/Image ./split_img/*-kernel
          ./repackimg.sh
          mv image-new.img ../kernelsu_boot.img
          cd ..
          echo "✅ Boot image repacked successfully!"
          ls -lh kernelsu_boot.img

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-build-${{ github.run_number }}
          path: |
            kernelsu_boot.img
            out/arch/arm64/boot/Image
            out/.config
          retention-days: 7

      - name: Create Release Summary
        shell: bash
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOL'
          ## 🎉 Build Complete!
          - **KernelSU Version:** ${{ inputs.kernelsu_version }}
          - **Build Date:** $(date)
          ### 📦 Artifacts
          - `kernelsu_boot.img` (Ready-to-flash boot image)
          - `Image` (Raw kernel image)
          ### 🚀 Installation
          Flash `kernelsu_boot.img` to your boot partition via Fastboot:
          ```bash
          fastboot flash boot kernelsu_boot.img
          ```
          EOL