name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to stock boot.img'
        required: true
        type: string
        default: 'https://raw.githubusercontent.com/samoht83/android_kernel_oneplus_sm4350/lineage-22.2/stock/original_boot.img'
      kernel_repo_url:
        description: 'Kernel Git repository URL'
        required: true
        type: string
        default: 'https://github.com/LineageOS/android_kernel_oneplus_sm4350.git'
      kernel_repo_branch:
        description: 'Kernel repository branch'
        required: true
        type: string
        default: 'lineage-22.2'
      kernelsu_version:
        description: 'KernelSU Git tag (e.g., v0.9.5)'
        required: true
        type: string
        default: 'v0.9.5'

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r50/clang-r450784d.tar.gz
      CLANG_DIR: ${{ runner.temp }}/clang
      CLANG_VERSION: clang-r450784d

    steps:
    - name: Checkout Kernel source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.kernel_repo_url }}
        path: kernel
        branch: ${{ github.event.inputs.kernel_repo_branch }}
        depth: 1

    - name: Cache Dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.CLANG_DIR }}
        key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

    - name: Download and extract Clang toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p ${{ env.CLANG_DIR }}
        curl -L "${{ env.CLANG_URL }}" | tar -xz -C ${{ env.CLANG_DIR }}

    - name: Add Clang to PATH
      run: |
        echo "${{ env.CLANG_DIR }}/${{ env.CLANG_VERSION }}/bin" >> $GITHUB_PATH
        clang --version

    - name: Clone KernelSU and setup
      run: |
        cd kernel
        git clone https://github.com/tiann/KernelSU.git kernelsu
        cd kernelsu
        git checkout ${{ github.event.inputs.kernelsu_version }}
        # The setup script needs to be executable
        chmod +x setup.sh
        ./setup.sh ../

    - name: Enable KernelSU in defconfig
      run: |
        DEFCONFIG=$(find kernel/arch/arm64/configs -name "*holi*_defconfig" | head -n1)
        if [ -n "$DEFCONFIG" ]; then
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "KernelSU enabled in $DEFCONFIG"
        else
          echo "holi defconfig not found!"
          exit 1
        fi

    - name: Build kernel
      run: |
        cd kernel
        make O=out ARCH=arm64 holi_defconfig
        make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

    - name: Download boot utility and stock image
      run: |
        curl -LO https://github.com/topjohnwu/Magisk/releases/download/v27.0/magiskboot
        chmod +x magiskboot
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

    - name: Repack boot image with new Kernel
      run: |
        mkdir stock_boot_unpacked
        ./magiskboot unpack stock_boot.img stock_boot_unpacked
        cp kernel/out/arch/arm64/boot/Image stock_boot_unpacked/kernel
        ./magiskboot repack stock_boot_unpacked new_boot.img

    - name: Set artifact name
      id: artifact_name
      run: echo "name=boot-KSU-${{ github.event.inputs.kernelsu_version }}-${{ github.event.inputs.kernel_repo_branch }}.img" >> $GITHUB_OUTPUT

    - name: Upload repacked boot.img
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact_name.outputs.name }}
        path: new_boot.img
