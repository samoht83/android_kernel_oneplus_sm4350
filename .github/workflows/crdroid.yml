name: Build crDroid 15 KernelSU ROM for Nord N200 (holi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 1440

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev x11proto-core-dev \
            libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 \
            openjdk-17-jdk ccache rsync lzop wget bc

      - name: Initialize crDroid 15 repo
        run: |
          mkdir ~/android && cd ~/android
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://github.com/crdroidandroid/android.git -b 15.0

      - name: Sync sources
        run: |
          cd ~/android
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Setup holi layout and KernelSU
        run: |
          cd ~/android
          echo "Setting up crDroid 15 layout for OnePlus Nord N200 (holi)..."
          mkdir -p device/oneplus vendor/oneplus kernel/oneplus

          # Clone device tree
          if [ ! -d device/oneplus/holi ]; then
            git clone https://github.com/LineageOS/android_device_oneplus_holi.git -b lineage-22.2 device/oneplus/holi
          else
            echo "Device tree already present."
          fi

          # Clone vendor blobs
          if [ ! -d vendor/oneplus ]; then
            git clone https://github.com/TheMuppets/proprietary_vendor_oneplus.git -b lineage-22.2 vendor/oneplus
          else
            echo "Vendor blobs already present."
          fi

          # Clone kernel source
          if [ ! -d kernel/oneplus/sm4350 ]; then
            git clone https://github.com/LineageOS/android_kernel_oneplus_sm4350.git -b lineage-22.2 kernel/oneplus/sm4350
          else
            echo "Kernel source already present."
          fi

          # Add KernelSU
          cd kernel/oneplus/sm4350
          if [ ! -d KernelSU ]; then
            echo "Integrating KernelSU..."
            git clone https://github.com/tiann/KernelSU.git -b main KernelSU
            echo "CONFIG_KSU=y" >> arch/arm64/configs/vendor/holi_defconfig
          fi
          cd ../../..

          echo
          echo "Verifying essential files..."
          test -f device/oneplus/holi/AndroidProducts.mk || echo "Warning: Missing AndroidProducts.mk"
          test -f kernel/oneplus/sm4350/Makefile || echo "Warning: Missing kernel Makefile"
          test -d vendor/oneplus/holi || echo "Warning: Missing vendor blobs"
          echo
          echo "Layout setup complete."

      - name: Setup build cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build crDroid for holi
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineage_holi-userdebug
          export USE_CCACHE=1
          ccache -M 50G
          mka bacon -j$(nproc --all)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-holi-ROM
          path: ~/android/out/target/product/holi/*.zip