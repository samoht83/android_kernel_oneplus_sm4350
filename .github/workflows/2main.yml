name: New Build Android Kernel with KernelSU v0.9.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: 🛠️ Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential bc bison flex libssl-dev ccache \
          libelf-dev libncurses-dev lzop python3 git wget unzip device-tree-compiler

    - name: 🧰 Setup Clang Toolchain
      run: |
        mkdir -p toolchains && cd toolchains
        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.6/clang+llvm-18.1.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz
        tar -xf clang+llvm-18.1.6-x86_64-linux-gnu-ubuntu-20.04.tar.xz
        echo "CLANG_PATH=$(pwd)/clang+llvm-18.1.6-x86_64-linux-gnu-ubuntu-20.04" >> $GITHUB_ENV

    - name: 💉 Clone KernelSU v0.9.5
      run: |
        git clone --depth=1 -b v0.9.5 https://github.com/tiann/KernelSU
        echo "KERNELSU_PATH=$(pwd)/KernelSU" >> $GITHUB_ENV

    - name: 🔀 Integrate KernelSU
      run: |
        cd $GITHUB_WORKSPACE
        KERNELSU_PATH=$(pwd)/KernelSU
        echo "Applying KernelSU patch..."
        bash $KERNELSU_PATH/tools/merge_kernel.sh $(pwd)

    - name: ⚙️ Configure Kernel
      run: |
        export PATH=$CLANG_PATH/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        make O=out vendor/nordn200_defconfig

    - name: 🧱 Build Kernel
      run: |
        export PATH=$CLANG_PATH/bin:$PATH
        make O=out -j$(nproc)

    - name: 📦 Prepare AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        cd anykernel
        zip -r9 ../Kernel-NordN200-KernelSU.zip * -x .git README.md

    - name: 📤 Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU-NordN200-Zip
        path: Kernel-NordN200-KernelSU.zip
