name: Build Boot Image

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo URL'
        required: true
      kernel_branch:
        description: 'Kernel branch'
        required: true
      defconfig:
        description: 'Defconfig name (without arch/arm64/configs/)'
        required: true
      dtbo:
        description: 'Build DTBO image? (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧹 Clean up Disk Space
        shell: bash
        run: |
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Setup Build Environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio curl flex git kmod libssl-dev libz-dev lz4 python3 python3-pip rsync unzip wget zip

      - name: 🌐 Setup LLVM/Clang Toolchain
        shell: bash
        run: |
          sudo mkdir -p /opt/clang
          wget -qO- https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz | sudo tar -xJ -C /opt/clang --strip-components=1
          echo "CLANG_PATH=/opt/clang/bin" >> $GITHUB_ENV

      - name: 📥 Clone Kernel Source
        shell: bash
        run: |
          BRANCH="${{ github.event.inputs.kernel_branch }}"
          if ! git clone --depth=1 --branch="$BRANCH" "${{ github.event.inputs.kernel_repo }}" kernel; then
            echo "::error::Failed to clone kernel source"
            exit 1
          fi

      - name: ⚙️ Prepare Kernel Source
        shell: bash
        run: |
          cd kernel
          if [ ! -f "Makefile" ] || [ ! -d "arch/arm64" ]; then
            echo "::error::Kernel source appears invalid."
            exit 1
          fi

      - name: 🏗️ Build Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          make O=out ARCH=arm64 "${{ github.event.inputs.defconfig }}"
          make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- LD=ld.lld

      - name: 📦 Build DTBO (Optional)
        if: inputs.dtbo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          export PATH="$CLANG_PATH:$PATH"
          make O=out ARCH=arm64 dtbo.img

      - name: 📦 Package Boot Image
        shell: bash
        run: |
          set -euo pipefail
          cd kernel/out
          if [ ! -f "arch/arm64/boot/Image.gz" ]; then
            echo "::error::Kernel image not found!"
            exit 1
          fi
          mkdir -p ../../AnyKernel3
          cp arch/arm64/boot/Image* ../../AnyKernel3/
          if [ -f arch/arm64/boot/dtbo.img ]; then
            cp arch/arm64/boot/dtbo.img ../../AnyKernel3/
          fi

      - name: 📦 Zip AnyKernel3
        shell: bash
        run: |
          cd AnyKernel3
          zip -r9 ../flashable_kernel.zip ./*

      - name: 📤 Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable_kernel
          path: flashable_kernel.zip

      - name: 📤 Upload Kernel Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_build_log
          path: kernel/out/build.log