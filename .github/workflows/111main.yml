name: Build + Patch Kernel + Repack Boot.img

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: KernelSU Kernel + Repack Boot
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Cache Clang Toolchain
      id: cache-clang
      uses: actions/cache@v3
      with:
        path: clang
        key: clang-17.0.6

    - name: Download and Extract Clang 17.0.6
      if:  steps.cache-clang.outputs.cache-hit != 'true'
      run: |
      mkdir -p clang && cd clang
      wget -L https://github.com/its-pointless/clang-for-android/releases/download/17.0.6/clang-llvm-17.0.6.tar.xz
    tar -xf clang-llvm-17.0.6.tar.xz
    rm clang-llvm-17.0.6.tar.xz

    - name: Set CLANG_PATH environment variable
      run: echo "CLANG_PATH=$(pwd)/clang/clang-llvm-17.0.6" >> $GITHUB_ENV

    - name: Apply KernelSU v0.9.5
      run: |
        git clone --depth=1 --branch v0.9.5 https://github.com/KernelSU/KernelSU.git KernelSU
        echo 'CONFIG_KERNELSU=y' >> arch/arm64/configs/vendor/holi-qgki_defconfig
        echo "KSU_PATCH_PATH=$(realpath KernelSU)" >> $GITHUB_ENV

    - name: Build Kernel with KernelSU
      run: |
        export PATH=$CLANG_PATH/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make O=out vendor/holi-qgki_defconfig
        make -j$(nproc) O=out \
          CC=clang \
          LLVM=1 \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          KERNELSU=1

    - name: Install Python Tools for Repacking
      run: |
        sudo apt install -y python3-pip python3-dev
        pip install -U protobuf
        git clone https://github.com/PainKiller3/unpack_bootimg.git tools/unpack_bootimg
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg

    - name: Download Stock Boot.img
      run: |
        mkdir stock && cd stock
        wget https://github.com/samoht83/android_kernel_oneplus_sm4350/raw/lineage-22.2/arch/arm64/boot/original_boot.img

    - name: Extract boot.img
      run: |
        mkdir extracted_boot
        python3 tools/unpack_bootimg/unpack_bootimg.py \
          --boot_img stock/original_boot.img \
          --out extracted_boot \
          --format mkbootimg

    - name: Replace Kernel in Extracted Boot
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb extracted_boot/kernel

    - name: Repack Patched boot.img
      run: |
        python3 tools/mkbootimg/mkbootimg.py \
          --kernel extracted_boot/kernel \
          --ramdisk extracted_boot/ramdisk \
          --cmdline "$(cat extracted_boot/cmdline)" \
          --base $(cat extracted_boot/base) \
          --pagesize $(cat extracted_boot/pagesize) \
          --os_version $(cat extracted_boot/os_version) \
          --os_patch_level $(cat extracted_boot/os_patch_level) \
          --header_version $(cat extracted_boot/header_version) \
          --tags_offset $(cat extracted_boot/tags_offset) \
          --dtb_offset $(cat extracted_boot/dtb_offset) \
          --ramdisk_offset $(cat extracted_boot/ramdisk_offset) \
          --kernel_offset $(cat extracted_boot/kernel_offset) \
          --board $(cat extracted_boot/board) \
          -o boot_patched.img

    - name: Upload Patched Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: boot_patched.img
        path: boot_patched.img