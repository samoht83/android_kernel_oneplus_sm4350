name: Build Nord N200 Kernel with KernelSU

on:
  # This allows you to run the workflow manually from the Actions tab on GitHub.
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel source branch to use (e.g., lineage-22.2)'
        required: true
        default: 'lineage-22.2' # The branch you specified
      KERNELSU_VERSION:
        description: 'KernelSU version/branch (e.g., main or v0.7.2)'
        required: true
        default: 'v0.9.5' # Use 'main' for the latest development version or specify a tag like 'v0.7.2'
      DEFCONFIG:
        description: 'Defconfig name (e.g., holi_defconfig, sm4350_defconfig). VERIFY THIS!'
        required: true
        default: 'holi_QGKIconfig' # Common defconfig for SM4350, verify in kernel source
      ANYKERNEL3_BRANCH:
        description: 'AnyKernel3 branch'
        required: true
        default: 'master'

jobs:
  build_kernel:
    runs-on: ubuntu-latest # GitHub-hosted runner with Ubuntu OS
    permissions:
      contents: write # Needed to upload artifacts

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: samoht83/android_kernel_oneplus_sm4350 # Your specified kernel source
        ref: ${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}
        path: kernel # Clones into a directory named 'kernel'

    - name: Checkout AnyKernel3
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3 # Standard AnyKernel3 repo
        ref: ${{ github.event.inputs.ANYKERNEL3_BRANCH }}
        path: AnyKernel3 # Clones into a directory named 'AnyKernel3'

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential flex bison libssl-dev libncurses5-dev git ccache lz4
        # Python3 is usually pre-installed on GitHub runners, but including for completeness
        sudo apt install -y python3 python3-pip

    - name: Clone AOSP Clang Toolchain and Binutils
      run: |
        # Using Projekt-Sapphire's maintained AOSP Clang prebuilts
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang --depth=1
        # Using Akhil Narang's binutils
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1

    - name: Set up Build Environment
      run: |
        # Set architecture and cross-compilation variables
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        
        # Set PATH for Clang and Binutils
        echo "$(pwd)/clang/bin:$(pwd)/binutils/aarch64-linux-gnu/bin:$(pwd)/binutils/arm-linux-gnueabi/bin:$PATH" >> $GITHUB_ENV
        
        # Set CROSS_COMPILE for both ARM64 and ARM32 (if needed by kernel makefiles)
        echo "CROSS_COMPILE=$(pwd)/clang/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CROSS_COMPILE_ARM32=$(pwd)/clang/bin/arm-linux-gnueabi-" >> $GITHUB_ENV
        
        # Enable LLVM and integrated assembler
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV 
        
        # Setup ccache for potentially faster rebuilds (though less impactful on fresh runners)
        echo "CCACHE_DIR=$(pwd)/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "export CCACHE_COMPILERCHECK=content" >> $GITHUB_ENV
        ccache -M 20G # Set ccache limit to 20GB
        ccache -z # Clear cache statistics for a fresh run

    - name: Integrate KernelSU
      working-directory: kernel
      run: |
        # Download and run the KernelSU setup script
        # This script patches the kernel source and sets up necessary configurations.
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.KERNELSU_VERSION }}

    - name: Clean Kernel Source
      working-directory: kernel
      run: |
        # Clean up previous build artifacts and configurations
        make O=out clean
        make O=out mrproper

    - name: Generate Defconfig
      working-directory: kernel
      run: |
        # Generate the .config file based on the specified defconfig
        make O=out ${{ github.event.inputs.DEFCONFIG }}

    - name: Build Kernel
      working-directory: kernel
      run: |
        # Compile the kernel using all available CPU cores
         make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1

    - name: Prepare AnyKernel3 Package
      working-directory: AnyKernel3
      run: |
        # Copy the compiled kernel image to the AnyKernel3 directory
        # The output file is typically Image.gz-dtb for ARM64 kernels
        cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
        # If your kernel builds a separate dtb.img or dtbo.img, you might need to copy them as well:
        # cp ../kernel/out/arch/arm64/boot/dtb.img .
        # cp ../kernel/out/arch/arm64/boot/dtbo.img .
        
        # Create the flashable zip
        zip -r9 "AnyKernel3-NordN200-KernelSU-${{ github.run_id }}.zip" * -x .git README.md *placeholder

    - name: Upload AnyKernel3 Package
      uses: actions/upload-artifact@v4
      with:
        name: NordN200-KernelSU-Kernel
        path: AnyKernel3/AnyKernel3-NordN200-KernelSU-*.zip
        retention-days: 7 # Artifact will be available for 7 days

    - name: Display Ccache Statistics
      run: ccache -s
      
