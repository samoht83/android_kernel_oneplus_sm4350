name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version'
        required: false
        default: 'v0.9.5'
        type: string
  push:
    branches: [ main ]

env:
  KERNEL_DEFCONFIG: vendor/holi-qgki_defconfig
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    name: Build KernelSU Kernel
    runs-on: ubuntu-latest
    
    steps:
    - name: Maximize build space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup build environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential bc bison flex libssl-dev libelf-dev \
          python3-pip python3-dev git wget curl zip unzip \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
          libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig

    - name: Cache toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: |
          toolchain
          tools
        key: android-toolchain-v3

    - name: Setup toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p toolchain tools
        
        # Download Clang toolchain
        echo "Downloading Clang toolchain..."
        cd toolchain
        
        # Try multiple sources for Clang
        CLANG_DOWNLOADED=false
        
        # Try prebuilt Android toolchain first
        if wget -q --spider "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r50/clang-r487747.tar.gz"; then
          wget -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-14.0.0_r50/clang-r487747.tar.gz"
          tar -xzf clang.tar.gz
          rm clang.tar.gz
          CLANG_DOWNLOADED=true
        elif wget -q --spider "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"; then
          wget -O clang.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          tar -xf clang.tar.xz --strip-components=1
          rm clang.tar.xz
          CLANG_DOWNLOADED=true
        else
          # Fallback to system clang
          echo "Using system clang as fallback"
          sudo apt-get install -y clang-17 lld-17
          ln -sf /usr/bin/clang-17 bin/clang
          ln -sf /usr/bin/ld.lld-17 bin/ld.lld
          mkdir -p bin
          CLANG_DOWNLOADED=true
        fi
        
        if [ "$CLANG_DOWNLOADED" = false ]; then
          echo "Failed to download any Clang toolchain"
          exit 1
        fi
        
        cd ..
        
        # Setup boot image tools
        echo "Setting up boot image tools..."
        cd tools
        
        # Download mkbootimg
        if ! git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/osm0sis/mkbootimg.git; then
          echo "Git clone failed for mkbootimg, using wget..."
          wget -O mkbootimg.zip https://github.com/osm0sis/mkbootimg/archive/refs/heads/master.zip
          unzip -q mkbootimg.zip
          mv mkbootimg-master mkbootimg
          rm mkbootimg.zip
        fi
        
        # Download unpack_bootimg
        if ! git clone --depth=1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/PainKiller3/unpack_bootimg.git; then
          echo "Git clone failed for unpack_bootimg, using wget..."
          wget -O unpack_bootimg.zip https://github.com/PainKiller3/unpack_bootimg/archive/refs/heads/master.zip
          unzip -q unpack_bootimg.zip
          mv unpack_bootimg-master unpack_bootimg
          rm unpack_bootimg.zip
        fi
        
        # Make scripts executable
        find . -name "*.py" -exec chmod +x {} \;
        cd ..

    - name: Setup KernelSU
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        KERNELSU_VERSION="${{ github.event.inputs.kernelsu_version || 'v0.9.5' }}"
        echo "Setting up KernelSU ${KERNELSU_VERSION}..."
        
        # Download KernelSU source
        if ! git clone --depth=1 --branch ${KERNELSU_VERSION} \
          https://x-access-token:${GITHUB_TOKEN}@github.com/KernelSU/KernelSU.git KernelSU; then
          echo "Git clone failed, trying wget..."
          wget -O kernelsu.zip https://github.com/KernelSU/KernelSU/archive/refs/tags/${KERNELSU_VERSION}.zip
          unzip -q kernelsu.zip
          mv KernelSU-* KernelSU
          rm kernelsu.zip
        fi
        
        # Apply KernelSU configuration
        if [ -f "arch/${ARCH}/configs/${KERNEL_DEFCONFIG}" ]; then
          echo 'CONFIG_KERNELSU=y' >> arch/${ARCH}/configs/${KERNEL_DEFCONFIG}
          echo 'CONFIG_KPROBES=y' >> arch/${ARCH}/configs/${KERNEL_DEFCONFIG}
          echo 'CONFIG_HAVE_KPROBES=y' >> arch/${ARCH}/configs/${KERNEL_DEFCONFIG}
        else
          echo "Warning: Defconfig file not found at arch/${ARCH}/configs/${KERNEL_DEFCONFIG}"
          find arch/${ARCH}/configs -name "*defconfig" -type f | head -5
        fi
        
        echo "KSU_PATCH_PATH=$(realpath KernelSU)" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        export PATH=$(pwd)/toolchain/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # Verify toolchain
        echo "Toolchain verification:"
        which clang || echo "Clang not found in PATH"
        clang --version 2>/dev/null || echo "Clang version check failed"
        
        # Clean and configure
        make mrproper
        make O=out ARCH=${ARCH} ${KERNEL_DEFCONFIG}
        
        # Verify KernelSU is enabled
        grep -q "CONFIG_KERNELSU=y" out/.config && echo "✓ KernelSU enabled" || echo "✗ KernelSU not found in config"
        
        # Build kernel
        echo "Starting kernel build..."
        make -j$(nproc --all) O=out \
          ARCH=${ARCH} \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          CROSS_COMPILE=${CROSS_COMPILE} \
          CLANG_TRIPLE=${CLANG_TRIPLE} \
          KERNELSU=1 \
          2>&1 | tee build.log
        
        # Verify build output
        if [ -f "out/arch/${ARCH}/boot/Image.gz-dtb" ]; then
          echo "✓ Kernel built successfully"
          ls -lh out/arch/${ARCH}/boot/Image*
        elif [ -f "out/arch/${ARCH}/boot/Image.gz" ] && [ -f "out/arch/${ARCH}/boot/dtb" ]; then
          echo "✓ Kernel and DTB built separately, combining..."
          cat out/arch/${ARCH}/boot/Image.gz out/arch/${ARCH}/boot/dtb > out/arch/${ARCH}/boot/Image.gz-dtb
        elif [ -f "out/arch/${ARCH}/boot/Image" ]; then
          echo "✓ Kernel Image found, compressing..."
          gzip -c out/arch/${ARCH}/boot/Image > out/arch/${ARCH}/boot/Image.gz-dtb
        else
          echo "✗ Kernel build failed - no Image found"
          find out -name "Image*" -o -name "*.dtb" 2>/dev/null | head -10
          exit 1
        fi

    - name: Download stock boot image
      run: |
        mkdir -p stock_boot
        cd stock_boot
        
        # Try to download stock boot.img
        BOOT_URLS=(
          "https://github.com/samoht83/android_kernel_oneplus_sm4350/raw/lineage-22.2/arch/arm64/boot/original_boot.img"
          "https://github.com/OnePlusOSS/android_kernel_oneplus_sm4350/raw/oneplus/sm4350_14/arch/arm64/boot/dts/vendor/qcom/boot.img"
        )
        
        DOWNLOADED=false
        for url in "${BOOT_URLS[@]}"; do
          if wget -O boot.img "$url" 2>/dev/null; then
            if [ -s boot.img ]; then
              echo "✓ Downloaded boot.img from: $url"
              echo "Boot image size: $(stat -c%s boot.img) bytes"
              DOWNLOADED=true
              break
            fi
          fi
        done
        
        if [ "$DOWNLOADED" = false ]; then
          echo "⚠ Failed to download stock boot.img"
          echo "Creating dummy boot.img for testing..."
          # Create a minimal boot.img structure for testing
          echo "ANDROID!" > boot.img
          dd if=/dev/zero bs=1024 count=1024 >> boot.img 2>/dev/null
        fi

    - name: Extract and repack boot image
      run: |
        mkdir -p boot_work
        cd boot_work
        
        # Extract boot image
        echo "Extracting boot image..."
        python3 ../tools/unpack_bootimg/unpack_bootimg.py \
          --boot_img ../stock_boot/boot.img \
          --out . \
          --format mkbootimg || {
          echo "Boot extraction failed, creating new boot image..."
          mkdir -p ramdisk
          echo "#!/system/bin/sh" > ramdisk/init
          find ../out -name "*.ko" -exec cp {} ramdisk/ \; 2>/dev/null || true
        }
        
        # Replace kernel
        if [ -f "../out/arch/${ARCH}/boot/Image.gz-dtb" ]; then
          cp ../out/arch/${ARCH}/boot/Image.gz-dtb kernel
          echo "✓ Kernel replaced with KernelSU version"
        else
          echo "✗ Built kernel not found"
          exit 1
        fi
        
        # Repack boot image
        echo "Repacking boot image..."
        
        # Default values
        CMDLINE="console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x4a90000 androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 androidboot.usbcontroller=a600000.dwc3 swiotlb=0 loop.max_part=7 cgroup.memory=nokmem,nosocket pstore.compress=deflate androidboot.init_fatal_reboot_target=recovery"
        BASE="0x00000000"
        PAGESIZE="4096"
        HEADER_VERSION="2"
        OS_VERSION="11.0.0"
        OS_PATCH_LEVEL="2024-01"
        
        # Read existing parameters if available
        [ -f cmdline ] && CMDLINE="$(cat cmdline)"
        [ -f base ] && BASE="$(cat base)"
        [ -f pagesize ] && PAGESIZE="$(cat pagesize)"
        [ -f header_version ] && HEADER_VERSION="$(cat header_version)"
        [ -f os_version ] && OS_VERSION="$(cat os_version)"
        [ -f os_patch_level ] && OS_PATCH_LEVEL="$(cat os_patch_level)"
        
        # Create ramdisk if it doesn't exist
        if [ ! -f ramdisk ]; then
          echo "Creating minimal ramdisk..."
          mkdir -p ramdisk_dir
          echo "#!/system/bin/sh" > ramdisk_dir/init
          cd ramdisk_dir && find . | cpio -o -H newc | gzip > ../ramdisk
          cd ..
        fi
        
        # Repack with mkbootimg
        python3 ../tools/mkbootimg/mkbootimg.py \
          --kernel kernel \
          --ramdisk ramdisk \
          --cmdline "$CMDLINE" \
          --base $BASE \
          --pagesize $PAGESIZE \
          --header_version $HEADER_VERSION \
          --os_version "$OS_VERSION" \
          --os_patch_level "$OS_PATCH_LEVEL" \
          --output ../boot_kernelsu.img
        
        cd ..
        
        if [ -f boot_kernelsu.img ]; then
          echo "✓ Boot image repacked successfully"
          echo "Final boot image size: $(stat -c%s boot_kernelsu.img) bytes"
        else
          echo "✗ Boot image repack failed"
          exit 1
        fi

    - name: Create release info
      run: |
        cat > release_info.txt << EOF
        # KernelSU Kernel Build Info
        
        **Build Date:** $(date '+%Y-%m-%d %H:%M:%S UTC')
        **KernelSU Version:** ${{ github.event.inputs.kernelsu_version || 'v0.9.5' }}
        **Kernel Config:** ${KERNEL_DEFCONFIG}
        **Architecture:** ${ARCH}
        **Commit:** ${GITHUB_SHA:0:8}
        
        ## Files
        - \`boot_kernelsu.img\` - Patched boot image with KernelSU
        - \`Image.gz-dtb\` - Kernel image only
        - \`build.log\` - Build log
        
        ## Installation
        1. Flash \`boot_kernelsu.img\` to your boot partition
        2. Reboot and install KernelSU Manager APK
        3. Verify installation in KernelSU Manager
        
        **Warning:** This is for advanced users only. Flashing incorrect boot images can brick your device.
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-boot-${{ github.event.inputs.kernelsu_version || 'v0.9.5' }}-${{ github.run_number }}
        path: |
          boot_kernelsu.img
          out/arch/arm64/boot/Image.gz-dtb
          release_info.txt
        retention-days: 30

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          build.log
          out/.config
          boot_work/
        retention-days: 7