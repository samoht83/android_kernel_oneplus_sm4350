name: Build APatch Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      BOOT_IMG_URL:
        description: "Direct link to stock or Lineage boot.img"
        required: true
      DEVICE_CODENAME:
        description: "Device codename (e.g., holi)"
        required: true
        default: "holi"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm4350
          ref: lineage-22.2
          submodules: recursive

      - name: Set up Build Environment
        run: |
          sudo apt update
          sudo apt install -y git wget curl lz4 unzip python3 python3-pip cpio flex bison
          # ✅ Working clang source mirror (no 400 error)
          wget -q https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86/archive/refs/heads/lineage-21.0.tar.gz -O clang.tar.gz
          mkdir -p $GITHUB_WORKSPACE/clang
          tar -xf clang.tar.gz --strip-components=1 -C $GITHUB_WORKSPACE/clang

      - name: Add APatch
        run: |
          git submodule add https://github.com/boreddroid/apatch.git kernel/apatch || true
          bash kernel/apatch/scripts/patch.sh || echo "APatch patch applied manually"

      - name: Configure and Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_COMPAT=arm-linux-androideabi-
          make O=out ${{ github.event.inputs.DEVICE_CODENAME }}_defconfig
          make O=out -j$(nproc)

      - name: Download Stock Boot Image
        run: |
          wget -O boot.img "${{ github.event.inputs.BOOT_IMG_URL }}"

      - name: Unpack Boot Image
        run: |
          git clone https://github.com/osm0sis/mkbootimg.git tools/mkbootimg
          mkdir unpacked
          python3 tools/mkbootimg/unpack_bootimg.py --boot_img boot.img --out unpacked

      - name: Replace Kernel Image
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb unpacked/kernel

      - name: Repack Boot Image
        run: |
          python3 tools/mkbootimg/mkbootimg.py \
            --kernel unpacked/kernel \
            --ramdisk unpacked/ramdisk \
            --cmdline "$(cat unpacked/cmdline)" \
            --base "$(cat unpacked/base)" \
            --pagesize "$(cat unpacked/pagesize)" \
            --os_version "$(cat unpacked/os_version)" \
            --os_patch_level "$(cat unpacked/os_patch_level)" \
            -o boot_apatch.img

      - name: Prepare AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          rm -f *.img
          cp ../boot_apatch.img ./Image.gz-dtb
          zip -r9 ../APatch-AnyKernel3.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APatch-Kernel-${{ github.event.inputs.DEVICE_CODENAME }}
          path: |
            boot_apatch.img
            APatch-AnyKernel3.zip