name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      LLVM: 1
      LLVM_IAS: 1
      USE_CCACHE: 1
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Apply KernelSU Patches
      run: |
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

    # 5️⃣b Fix minstrel_mcs_groups const mismatch
      - name: Fix minstrel_mcs_groups const mismatch
        run: |
          sed -i 's/struct mcs_group minstrel_mcs_groups\[/const struct mcs_group minstrel_mcs_groups\[/' kernel/net/mac80211/rc80211_minstrel_ht.c

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y lld llvm ccache curl tar gzip xz-utils python3 unzip git

    - name: Cache Android 14 Clang Toolchain
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: $HOME/clang-android-14
        key: ${{ runner.os }}-clang-android-14.0.0_r50-${{ hashFiles('**/toolchain_version.txt') }}
        restore-keys: |
          ${{ runner.os }}-clang-android-14.0.0_r50-
          ${{ runner.os }}-clang-

    - name: Download Android 14 Clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p $HOME/clang-android-14
        curl -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50.tar.gz \
          | tar -xz -C $HOME/clang-android-14

    - name: Setup Clang PATH
      run: echo "$HOME/clang-android-14/bin" >> $GITHUB_PATH

    - name: Download GCC binutils
      run: |
        curl -L "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz" \
          -o binutils.tar.gz
        mkdir -p binutils
        tar -xzf binutils.tar.gz -C binutils
        rm binutils.tar.gz

    - name: Download mkbootimg
      run: |
        MKBOOTIMG_URL="https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/master.tar.gz"
        mkdir -p $HOME/mkbootimg
        curl -L "$MKBOOTIMG_URL" | tar -xz -C $HOME/mkbootimg
        echo "$HOME/mkbootimg" >> $GITHUB_PATH

    - name: Enable ccache
      run: |
        ccache --max-size=5G
        ccache --zero-stats

    - name: Build Kernel
      run: |
        export PATH="$HOME/clang-android-14/bin:$PATH"
        make O=out ARCH=arm64 vendor/holi-qgki_defconfig
        make -j$(nproc) O=out ARCH=arm64

    - name: Download stock boot image
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

    - name: Unpack stock boot image
      run: |
        mkdir stock_boot
        python3 $HOME/mkbootimg/unpack_bootimg.py --boot_img stock_boot.img --out stock_boot

    - name: Repack boot image with new kernel
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb stock_boot/kernel
        python3 $HOME/mkbootimg/mkbootimg.py \
          --kernel stock_boot/kernel \
          --ramdisk stock_boot/ramdisk \
          --cmdline "$(cat stock_boot/cmdline)" \
          --base $(cat stock_boot/base) \
          --pagesize $(cat stock_boot/pagesize) \
          --os_version $(cat stock_boot/os_version) \
          --os_patch_level $(cat stock_boot/os_patch_level) \
          --output new_boot.img

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp new_boot.img AnyKernel3/
        cd AnyKernel3
        zip -r9 ../KernelSU_boot.zip .

    - name: Upload KernelSU Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: KernelSU_boot.zip
        path: KernelSU_boot.zip
