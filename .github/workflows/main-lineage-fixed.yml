name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: "URL to the stock boot.img for repacking"
        required: true
        default: "https://mirrorbits.lineageos.org/full/dre/20250808/boot.img"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      USE_CCACHE: 1
      CCACHE_COMPILERCHECK: content
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.gz
      MKBOOTIMG_URL: https://android.googlesource.com/platform/prebuilts/mkbootimg/+archive/refs/heads/master/linux-x86.tar.gz

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_oneplus_sm4350
        ref: lineage-22.2

    - name: Setup ccache
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache python3
        ccache --max-size=5G

    - name: Download Clang Toolchain
      run: |
        mkdir clang
        curl -L $CLANG_URL | tar -xz -C clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    - name: Download mkbootimg & unpack_bootimg
      run: |
        mkdir mkbootimg_bin
        curl -L $MKBOOTIMG_URL | tar -xz -C mkbootimg_bin
        chmod +x mkbootimg_bin/mkbootimg mkbootimg_bin/unpack_bootimg
        echo "$PWD/mkbootimg_bin" >> $GITHUB_PATH

    - name: Download Stock Boot Image
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

    - name: Unpack Stock Boot Image
      run: |
        mkdir boot_unpack
        unpack_bootimg --boot_img stock_boot.img --out boot_unpack
        echo "Unpacked files:"
        ls -la boot_unpack || true

    - name: Build Kernel
      run: |
        export PATH="$PWD/clang/bin:$PATH"
        mkdir -p kernel/out
        make O=kernel/out vendor/holi-qgki_defconfig
        make -j$(nproc) O=kernel/out

    - name: Find DTB and Create Image.gz-dtb
      run: |
        DTB_FILE=$(find kernel/out/arch/arm64/boot/dts/ -type f -name "*holi*.dtb" | head -n1 || true)
        if [ -z "$DTB_FILE" ]; then
          echo "Error: DTB for holi not found!"
          exit 1
        fi
        gzip -c kernel/out/arch/arm64/boot/Image > kernel/out/arch/arm64/boot/Image.gz
        cat kernel/out/arch/arm64/boot/Image.gz "$DTB_FILE" > Image.gz-dtb

    - name: Replace Kernel in Boot Image
      run: |
        cp Image.gz-dtb boot_unpack/kernel

    - name: Repack Boot Image
      run: |
        if [ -f boot_unpack/mkbootimg_args ]; then
          mkbootimg $(cat boot_unpack/mkbootimg_args) --kernel boot_unpack/kernel --output new_boot.img
        else
          echo "mkbootimg_args not found — rebuilding manually."
          mkbootimg \
            --kernel boot_unpack/kernel \
            --ramdisk boot_unpack/ramdisk \
            --base $(cat boot_unpack/base) \
            --pagesize $(cat boot_unpack/pagesize) \
            --os_version $(cat boot_unpack/os_version) \
            --os_patch_level $(cat boot_unpack/os_patch_level) \
            --header_version $(cat boot_unpack/header_version) \
            --output new_boot.img
        fi

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cd AnyKernel3
        cp ../Image.gz-dtb .
        zip -r9 "../AnyKernel3-NordN200-KernelSU.zip" . -x "*.git*" README.md *placeholder

    - name: Upload Boot Image & AnyKernel3 Zip
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          new_boot.img
          AnyKernel3-NordN200-KernelSU.zip