name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.xz

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm4350
          ref: lineage-22.2
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 ccache lz4 libarchive-tools build-essential libncurses5-dev libssl-dev flex bison

      - name: Cache Toolchains & Helpers
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchains/clang
            toolchains/binutils
            $HOME/mkbootimg
            AnyKernel3
          key: toolchain-${{ hashFiles('build_scripts/toolchain_version.txt') }}

      # 7️⃣ Download Toolchains & mkbootimg (if not cached)
      - name: Download Toolchains & mkbootimg
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains/clang toolchains/binutils

          echo "Downloading minimal AOSP Clang..."
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
          curl -L "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchains/clang --strip-components=1
          rm clang.tar.gz

          echo "Downloading GCC binutils..."
          GCC_URL="https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz"
          curl -L "$GCC_URL" -o binutils.tar.gz
          tar -xzf binutils.tar.gz -C toolchains/binutils --strip-components=1
          rm binutils.tar.gz

          echo "Downloading mkbootimg..."
          MKBOOTIMG_URL="https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/master.tar.gz"
          mkdir -p $HOME/mkbootimg
          curl -L "$MKBOOTIMG_URL" | tar -xz -C $HOME/mkbootimg
          echo "$HOME/mkbootimg" >> $GITHUB_PATH

      - name: Enable ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      - name: Apply KernelSU
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -
          cd ..

      - name: Fix minstrel_mcs_groups const mismatch
        run: |
          sed -i 's/struct mcs_group minstrel_mcs_groups\[/const struct mcs_group minstrel_mcs_groups\[/' net/mac80211/rc80211_minstrel_ht.c

      - name: Patch rc80211_minstrel_exit
        run: |
          echo '
          void rc80211_minstrel_exit(void) {
              /* Empty stub to satisfy linker */
          }
          ' >> net/mac80211/rc80211_minstrel_stub.c

      - name: Configure Kernel
        run: |
          export PATH="$HOME/clang-android-14/bin:$PATH"
          make O=out ARCH=arm64 vendor/holi-qgki_defconfig

          # Enable additional kernel configs
          cd out
          ../scripts/config --enable TRACEPOINTS

          # mac80211 minstrel fix
          ../scripts/config --enable MAC80211
          ../scripts/config --enable MAC80211_MINSTREL
          ../scripts/config --enable CFG80211

          # Qualcomm WALT scheduler + tracepoints
          ../scripts/config --enable SCHED_WALT
          ../scripts/config --enable WALT
          ../scripts/config --enable SCHED_WALT_DEBUG
          ../scripts/config --enable SCHED_WALT_TRACE

          # CPU core control tracepoints
          ../scripts/config --enable CPU_FREQ_GOV_SCHEDUTIL
          ../scripts/config --enable CPU_FREQ_GOV_POWERSAVE
          ../scripts/config --enable CPU_FREQ_GOV_PERFORMANCE
          ../scripts/config --enable CPU_FREQ_GOV_CONSERVATIVE
          ../scripts/config --enable CPU_FREQ_GOV_ONDEMAND

          # Qualcomm core_ctl
          ../scripts/config --enable MSM_CORE_CTL
          ../scripts/config --enable MSM_CORE_CTL_DEBUG
          ../scripts/config --enable MSM_CORE_CTL_TRACE

          # Regenerate .config
          make olddefconfig
          cd ..

      - name: Build Kernel
        run: |
          export PATH="$HOME/clang-android-14/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang

      - name: Download Stock Boot
        run: |
          curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

      - name: Unpack Boot Image
        run: |
          mkdir stock_boot
          (cd stock_boot && unpackbootimg --input ../stock_boot.img --out .)

      - name: Repack Boot Image
        run: |
          mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --ramdisk stock_boot/ramdisk \
            --cmdline "$(cat stock_boot/cmdline)" \
            --base $(cat stock_boot/base) \
            --pagesize $(cat stock_boot/pagesize) \
            --os_version $(cat stock_boot/os_version) \
            --os_patch_level $(cat stock_boot/os_patch_level) \
            --output boot-KernelSU.img

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: boot-KernelSU
          path: boot-KernelSU.img