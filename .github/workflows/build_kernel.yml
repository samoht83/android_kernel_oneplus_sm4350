name: Build Kernel with APatch and SUFS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggers

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  DEFCONFIG: holi-qgki_defconfig  # Change to your actual defconfig
  THREADS: 8

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          git \
          python3 \
          device-tree-compiler \
          lz4 \
          lzop \
          curl \
          unzip

    - name: Download and setup AArch64 toolchain
      run: |
        # Download Android NDK (version 25)
        wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
        unzip android-ndk-r25b-linux.zip
        export NDK_HOME=$PWD/android-ndk-r25b
        
        # Set up toolchain paths
        export PATH=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export PATH=$NDK_HOME/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin:$PATH
        
        echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

        # Verify toolchain
        aarch64-linux-android-gcc --version
        clang --version

    - name: Add APatch
      run: |
        if [ ! -d "drivers/apatch" ]; then
          git clone https://github.com/bmax121/APatch.git drivers/apatch
        else
          echo "APatch already exists, updating..."
          cd drivers/apatch && git pull origin main && cd ../..
        fi

    - name: Add SUFS
      run: |
        if [ ! -d "fs/sufs" ]; then
          git clone https://github.com/youesf/sufs.git fs/sufs
        else
          echo "SUFS already exists, updating..."
          cd fs/sufs && git pull origin master && cd ../..
        fi

    - name: Configure kernel build files
      run: |
        # Add APatch to drivers/Makefile
        if ! grep -q "obj-.*apatch" drivers/Makefile; then
          echo 'obj-$(CONFIG_APATCH) += apatch/' >> drivers/Makefile
        fi

        # Add SUFS to fs/Makefile
        if ! grep -q "obj-.*sufs" fs/Makefile; then
          echo 'obj-$(CONFIG_SUFS) += sufs/' >> fs/Makefile
        fi

        # Add Kconfig entries
        if ! grep -q "source.*apatch" drivers/Kconfig; then
          echo 'source "drivers/apatch/Kconfig"' >> drivers/Kconfig
        fi

        if ! grep -q "source.*sufs" fs/Kconfig; then
          echo 'source "fs/sufs/Kconfig"' >> fs/Kconfig
        fi

    - name: Update defconfig with APatch and SUFS options
      run: |
        # Create a script to update defconfig
        CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
        
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "ERROR: Defconfig file not found: $CONFIG_FILE"
          exit 1
        fi

        # Backup original defconfig
        cp "$CONFIG_FILE" "${CONFIG_FILE}.bak"

        # Add required configurations (only if they don't exist)
        grep -q "CONFIG_MODULES=y" "$CONFIG_FILE" || echo "CONFIG_MODULES=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_MODULE_UNLOAD=y" "$CONFIG_FILE" || echo "CONFIG_MODULE_UNLOAD=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_KALLSYMS=y" "$CONFIG_FILE" || echo "CONFIG_KALLSYMS=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_KALLSYMS_ALL=y" "$CONFIG_FILE" || echo "CONFIG_KALLSYMS_ALL=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_OVERLAY_FS=y" "$CONFIG_FILE" || echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_APATCH=y" "$CONFIG_FILE" || echo "CONFIG_APATCH=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_KPROBES=y" "$CONFIG_FILE" || echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_HAVE_KPROBES=y" "$CONFIG_FILE" || echo "CONFIG_HAVE_KPROBES=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_KPROBE_EVENTS=y" "$CONFIG_FILE" || echo "CONFIG_KPROBE_EVENTS=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_SUFS=y" "$CONFIG_FILE" || echo "CONFIG_SUFS=y" >> "$CONFIG_FILE"
        grep -q "CONFIG_MEMFD_CREATE=y" "$CONFIG_FILE" || echo "CONFIG_MEMFD_CREATE=y" >> "$CONFIG_FILE"

        echo "Defconfig updated successfully"

    - name: Configure kernel
      run: |
        make $DEFCONFIG
        
        # Verify APatch and SUFS are enabled
        echo "=== Checking enabled configurations ==="
        grep -E "CONFIG_APATCH|CONFIG_SUFS" .config || true

    - name: Build kernel
      run: |
        # Build with verbose output for debugging
        make -j$THREADS V=1 2>&1 | tee build.log

        # Check if build was successful
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          echo "Build successful!"
        else
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          echo "Build failed!"
          exit 1
        fi

    - name: Verify built symbols
      if: env.BUILD_SUCCESS == 'true'
      run: |
        # Extract kernel image for symbol checking
        if [ -f "arch/arm64/boot/Image.gz" ]; then
          gunzip -c arch/arm64/boot/Image.gz > arch/arm64/boot/Image
        fi

        # Check for APatch symbols
        if [ -f "arch/arm64/boot/Image" ]; then
          echo "=== Checking for APatch symbols ==="
          nm arch/arm64/boot/Image | grep -i apatch || echo "No APatch symbols found"
          
          echo "=== Checking for SUFS symbols ==="
          nm arch/arm64/boot/Image | grep -i sufs || echo "No SUFS symbols found"
        else
          echo "Kernel image not available for symbol checking"
        fi

    - name: Create artifacts
      if: env.BUILD_SUCCESS == 'true'
      run: |
        # Create output directory
        mkdir -p artifacts

        # Copy built kernel image
        cp arch/arm64/boot/Image.gz-dtb artifacts/

        # Copy config
        cp .config artifacts/config

        # Copy build log
        cp build.log artifacts/

        # Create info file
        echo "Build date: $(date)" > artifacts/build-info.txt
        echo "Git commit: $(git rev-parse HEAD)" >> artifacts/build-info.txt
        echo "Defconfig: $DEFCONFIG" >> artifacts/build-info.txt
        echo "ARCH: $ARCH" >> artifacts/build-info.txt

        # List modules (if any)
        find . -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true

        # List all artifacts
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.sha }}
        path: artifacts/
        if-no-files-found: error

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-failure-${{ github.sha }}
        path: build.log

  cleanup:
    runs-on: ubuntu-22.04
    needs: build-kernel
    if: always()
    steps:
    - name: Cleanup workspace
      run: echo "Build completed with status: ${{ needs.build-kernel.result }}"