name: Build Kernel with APatch and SUFS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  DEFCONFIG: holi-qgki_defconfig
  THREADS: 8
  NDK_VERSION: r25b
  NDK_HOME_PATH: ${{ github.workspace }}/android-ndk-r25b

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc git python3 \
            device-tree-compiler lz4 lzop curl unzip ccache

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_HOME_PATH }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Download and setup NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip
          mv android-ndk-${{ env.NDK_VERSION }} ${{ env.NDK_HOME_PATH }}

      - name: Export NDK paths
        run: |
          echo "NDK_HOME=${{ env.NDK_HOME_PATH }}" >> $GITHUB_ENV
          echo "${{ env.NDK_HOME_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "${{ env.NDK_HOME_PATH }}/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Cache kernel build objects
        uses: actions/cache@v4
        with:
          path: |
            out
            .ccache
          key: kernel-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ runner.os }}-

      - name: Add APatch and SUFS
        run: |
          git clone https://github.com/bmax121/APatch.git drivers/apatch --depth=1 || (cd drivers/apatch && git pull)
          git clone https://github.com/youesf/sufs.git fs/sufs --depth=1 || (cd fs/sufs && git pull)

      - name: Configure kernel build files
        run: |
          if ! grep -q "apatch/" drivers/Makefile; then
            echo 'obj-$(CONFIG_APATCH) += apatch/' >> drivers/Makefile
          fi
          if ! grep -q "sufs/" fs/Makefile; then
            echo 'obj-$(CONFIG_SUFS) += sufs/' >> fs/Makefile
          fi
          if ! grep -q "drivers/apatch/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/apatch/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "fs/sufs/Kconfig" fs/Kconfig; then
            echo 'source "fs/sufs/Kconfig"' >> fs/Kconfig
          fi

      - name: Update defconfig
        run: |
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG }}"
          echo "Updating $CONFIG_FILE"
          cat <<EOF >> "$CONFIG_FILE"

# Added for APatch and SUFS
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_OVERLAY_FS=y
CONFIG_APATCH=y
CONFIG_KPROBES=y
CONFIG_HAVE_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_SUFS=y
CONFIG_MEMFD_CREATE=y
EOF

      - name: Configure kernel
        run: |
          make O=out ${{ env.DEFCONFIG }}

      - name: Build kernel
        id: build
        run: |
          set -o pipefail
          make -C . O=out -j${{ env.THREADS }} CC=clang 2>&1 | tee build.log

      - name: Verify built symbols
        if: success()
        run: |
          echo "Verifying symbols in out/vmlinux..."
          nm out/vmlinux | grep -i apatch || echo "No APatch symbols found"
          nm out/vmlinux | grep -i sufs || echo "No SUFS symbols found"

      - name: Create artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz-dtb artifacts/ || true
          cp out/.config artifacts/config || true
          cp build.log artifacts/ || true
          
          cat <<EOF > artifacts/build-info.txt
          Build date: $(date)
          Git commit: ${{ github.sha }}
          Defconfig: ${{ env.DEFCONFIG }}
          ARCH: ${{ env.ARCH }}
          EOF

          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true
          echo "Artifacts created:"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore

  cleanup:
    runs-on: ubuntu-22.04
    needs: build-kernel
    if: always()
    steps:
      - name: Final status
        run: echo "Build job completed with status: ${{ needs.build-kernel.result }}"