name: Build Kernel with APatch and SUFS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  DEFCONFIG: holi-qgki_defconfig
  THREADS: 8
  NDK_VERSION: r25b

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            python3 \
            device-tree-compiler \
            lz4 \
            lzop \
            curl \
            unzip

      # Cache NDK
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Download and setup AArch64 toolchain
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip android-ndk-${NDK_VERSION}-linux.zip
          mv android-ndk-${NDK_VERSION} $GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}

      - name: Export NDK paths
        run: |
          export NDK_HOME=$GITHUB_WORKSPACE/android-ndk-${NDK_VERSION}
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "$NDK_HOME/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # Cache kernel build objects
      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: |
            out
            .ccache
          key: kernel-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ runner.os }}-

      - name: Add APatch
        run: |
          if [ ! -d "drivers/apatch" ]; then
            git clone https://github.com/bmax121/APatch.git drivers/apatch
          else
            cd drivers/apatch && git pull origin main && cd ../..
          fi

      - name: Add SUFS
        run: |
          if [ ! -d "fs/sufs" ]; then
            git clone https://github.com/youesf/sufs.git fs/sufs
          else
            cd fs/sufs && git pull origin master && cd ../..
          fi

      - name: Configure kernel build files
        run: |
          if ! grep -q "obj-.*apatch" drivers/Makefile; then
            echo 'obj-$(CONFIG_APATCH) += apatch/' >> drivers/Makefile
          fi
          if ! grep -q "obj-.*sufs" fs/Makefile; then
            echo 'obj-$(CONFIG_SUFS) += sufs/' >> fs/Makefile
          fi
          if ! grep -q "source.*apatch" drivers/Kconfig; then
            echo 'source "drivers/apatch/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "source.*sufs" fs/Kconfig; then
            echo 'source "fs/sufs/Kconfig"' >> fs/Kconfig
          fi

      - name: Update defconfig with APatch and SUFS options
        run: |
          CONFIG_FILE="arch/arm64/configs/$DEFCONFIG"
          [ -f "$CONFIG_FILE" ] || { echo "Missing defconfig $CONFIG_FILE"; exit 1; }
          cp "$CONFIG_FILE" "${CONFIG_FILE}.bak"
          for opt in CONFIG_MODULES CONFIG_MODULE_UNLOAD CONFIG_KALLSYMS \
                     CONFIG_KALLSYMS_ALL CONFIG_OVERLAY_FS CONFIG_APATCH \
                     CONFIG_KPROBES CONFIG_HAVE_KPROBES CONFIG_KPROBE_EVENTS \
                     CONFIG_SUFS CONFIG_MEMFD_CREATE; do
            grep -q "${opt}=y" "$CONFIG_FILE" || echo "${opt}=y" >> "$CONFIG_FILE"
          done

      - name: Configure kernel
        run: |
          make O=out $DEFCONFIG
          grep -E "CONFIG_APATCH|CONFIG_SUFS" out/.config || true

      - name: Build kernel
        run: |
          make -C . O=out -j$THREADS V=1 2>&1 | tee build.log
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Verify built symbols
        if: env.BUILD_SUCCESS == 'true'
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            gunzip -c out/arch/arm64/boot/Image.gz > out/arch/arm64/boot/Image
          fi
          if [ -f "out/arch/arm64/boot/Image" ]; then
            nm out/arch/arm64/boot/Image | grep -i apatch || echo "No APatch symbols found"
            nm out/arch/arm64/boot/Image | grep -i sufs || echo "No SUFS symbols found"
          fi

      - name: Create artifacts
        if: env.BUILD_SUCCESS == 'true'
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz-dtb artifacts/
          cp out/.config artifacts/config
          cp build.log artifacts/
          echo "Build date: $(date)" > artifacts/build-info.txt
          echo "Git commit: $(git rev-parse HEAD)" >> artifacts/build-info.txt
          echo "Defconfig: $DEFCONFIG" >> artifacts/build-info.txt
          echo "ARCH: $ARCH" >> artifacts/build-info.txt
          find out -name "*.ko" -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: env.BUILD_SUCCESS == 'true'
        with:
          name: kernel-build-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure-${{ github.sha }}
          path: build.log

  cleanup:
    runs-on: ubuntu-22.04
    needs: build-kernel
    if: always()
    steps:
      - name: Cleanup workspace
        run: echo "Build completed with status: ${{ needs.build-kernel.result }}"