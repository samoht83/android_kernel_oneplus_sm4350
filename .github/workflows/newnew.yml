name: Build Kernel with KernelSU + SUSFS + KPM

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: holi-qgki_defconfig
  CLANG_VERSION: clang-r450784d
  KERNEL_DIR: kernel
  OUT_DIR: out

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: samoht83/android_kernel_oneplus_sm4350
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget curl bc bison flex libssl-dev make zip unzip ccache rsync

      # Cache Clang toolchain
      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: prebuilts-clang
          key: ${{ runner.os }}-clang-${{ env.CLANG_VERSION }}

      - name: Download Clang Toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 prebuilts-clang
          cd prebuilts-clang
          git checkout android13-release   # contains clang-r450784d

      - name: Add Clang to PATH
        run: echo "PATH=$(pwd)/prebuilts-clang/bin:$PATH" >> $GITHUB_ENV

      # Cache AnyKernel3 and patches
      - name: Cache Sources
        uses: actions/cache@v4
        with:
          path: |
            AnyKernel3
            KernelSU
            susfs-src
            kpm-src
          key: ${{ runner.os }}-patches-v1

      - name: Apply KernelSU, SUSFS, and KPM
        run: |
          cd ${{ env.KERNEL_DIR }}

          # KernelSU
          if [ ! -d "../KernelSU" ]; then
            git clone https://github.com/tiann/KernelSU.git ../KernelSU
          fi
          bash ../KernelSU/kernel/setup.sh || true

          # SUSFS
          if [ ! -d "../susfs-src" ]; then
            git clone https://github.com/tiann/susfs.git ../susfs-src
          fi
          rsync -av ../susfs-src/ ./

          # KPM
          if [ ! -d "../kpm-src" ]; then
            git clone https://github.com/tiann/KernelPatchManager.git ../kpm-src
          fi
          rsync -av ../kpm-src/ ./

      - name: Configure Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU=y" >> ${{ env.OUT_DIR }}/.config
          echo "CONFIG_SUSFS=y" >> ${{ env.OUT_DIR }}/.config
          echo "CONFIG_KPM=y" >> ${{ env.OUT_DIR }}/.config
          make O=${{ env.OUT_DIR }} olddefconfig

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          make O=${{ env.OUT_DIR }} -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1

      - name: Prepare AnyKernel3
        run: |
          if [ ! -d "AnyKernel3" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 KernelSU-SUSFS-KPM-${{ github.sha }}.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-SUSFS-KPM
          path: AnyKernel3/*.zip