name: Build Kernel with KernelSU + SUSFS + KPM

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50.tar.gz
      GCC_URL: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz
      MKBOOTIMG_URL: https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/master.tar.gz
      KERNEL_DIR: ${{ github.workspace }}
      OUT_DIR: ${{ github.workspace }}/out
      DEFCONFIG: vendor/lahaina-qgki_defconfig

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm4350
          ref: lineage-22.2
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip python3 python3-venv jq ccache lz4 \
            libarchive-tools build-essential libncurses5-dev libssl-dev flex bison \
            libelf-dev bc dwarves lld llvm clang rsync

      - name: Cache Android 14 Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang-android-14
          key: ${{ runner.os }}-clang-${{ hashFiles('**/.github/workflows/*.yml') }}

      - name: Download and Setup Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Android 14 Clang..."
          mkdir -p ${{ runner.temp }}/clang-android-14
          curl -L ${{ env.CLANG_URL }} | tar -xz -C ${{ runner.temp }}/clang-android-14

      - name: Download and Setup Binutils & mkbootimg
        run: |
          echo "Fetching GCC binutils..."
          mkdir -p ${{ runner.temp }}/binutils
          curl -L "${{ env.GCC_URL }}" | tar -xz -C ${{ runner.temp }}/binutils

          echo "Fetching mkbootimg/unpack_bootimg scripts..."
          mkdir -p ${{ runner.temp }}/mkbootimg
          curl -L "${{ env.MKBOOTIMG_URL }}" | tar -xz -C ${{ runner.temp }}/mkbootimg

          # Create simple shims for mkbootimg and unpackbootimg
          mkdir -p ${{ runner.temp }}/bin
          cat > ${{ runner.temp }}/bin/mkbootimg <<'EOF'
          #!/usr/bin/env bash
          exec python3 "${{ runner.temp }}/mkbootimg/mkbootimg.py" "$@"
          EOF

          cat > ${{ runner.temp }}/bin/unpackbootimg <<'EOF'
          #!/usr/bin/env bash
          exec python3 "${{ runner.temp }}/mkbootimg/unpack_bootimg.py" "$@"
          EOF
          chmod +x ${{ runner.temp }}/bin/mkbootimg ${{ runner.temp }}/bin/unpackbootimg

      - name: Configure PATH for All Tools
        run: |
          echo "${{ runner.temp }}/clang-android-14/bin" >> $GITHUB_PATH
          echo "${{ runner.temp }}/binutils/bin" >> $GITHUB_PATH
          echo "${{ runner.temp }}/bin" >> $GITHUB_PATH

      - name: Enable ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
      
      # Cache KernelSU, SUSFS, KPM, AnyKernel3
      - name: Cache Sources
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/KernelSU
            ${{ github.workspace }}/susfs-src
            ${{ github.workspace }}/kpm-src
            ${{ github.workspace }}/AnyKernel3
          key: ${{ runner.os }}-patches-v1

      - name: Apply KernelSU, SUSFS, and KPM
        run: |
          cd ${{ github.workspace }}

          # KernelSU
          if [ ! -d "KernelSU" ]; then
            git clone https://github.com/tiann/KernelSU.git KernelSU
          fi
          bash KernelSU/kernel/setup.sh || true

          # SUSFS
          if [ ! -d "susfs-src" ]; then
            git clone https://github.com/tiann/susfs.git susfs-src
          fi
          rsync -av susfs-src/ ./

          # KPM
          if [ ! -d "kpm-src" ]; then
            git clone https://github.com/tiann/KernelPatchManager.git kpm-src
          fi
          rsync -av kpm-src/ ./

      - name: Configure Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          mkdir -p ${{ env.OUT_DIR }}
          make O=${{ env.OUT_DIR }} ${{ env.DEFCONFIG }}
          echo "CONFIG_KSU=y" >> ${{ env.OUT_DIR }}/.config
          echo "CONFIG_SUSFS=y" >> ${{ env.OUT_DIR }}/.config
          echo "CONFIG_KPM=y" >> ${{ env.OUT_DIR }}/.config
          make O=${{ env.OUT_DIR }} olddefconfig

      - name: Build Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}
          make O=${{ env.OUT_DIR }} -j$(nproc) \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1

      - name: Prepare AnyKernel3
        run: |
          cd ${{ github.workspace }}
          if [ ! -d "AnyKernel3" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          fi
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 KernelSU-SUSFS-KPM-${{ github.sha }}.zip *

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-SUSFS-KPM
          path: AnyKernel3/*.zip