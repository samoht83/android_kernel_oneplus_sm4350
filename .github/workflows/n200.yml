name: Build OnePlus_SukiSU Ultra (Nord N200)

on:
  workflow_dispatch:
    inputs:
      SUSFS_CI:
        type: choice
        description: "SUSFS module download method"
        required: true
        default: CI
        options:
          - CI
          - Release
          - NoN
      HOOK:
        type: choice
        description: "Hook selection"
        required: true
        default: manual
        options:
          - kprobe
          - manual
          - tracepoint
      KSU_META:
        type: string
        description: "Branch name / Custom version (leave empty for default)"
        required: false
        default: "susfs-main/Numbersf"
      SUFFIX:
        type: string
        description: "Custom kernel suffix (leave empty for random)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable fast build?"
        required: true
        default: true
      KPM:
        type: boolean
        description: "Enable Kernel Module (KPM)?"
        required: true
        default: true
      SCHED:
        type: boolean
        description: "Enable SCHED driver?"
        required: true
        default: false
      ZRAM:
        type: boolean
        description: "Enable extra ZRAM algorithms?"
        required: true
        default: false

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: holi-qgki_defconfig
  DEVICE: Nord-N200
  CLANG_PATH: prebuilts/clang/host/linux-x86/clang-r416183b
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KSU_VERSION: main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true

      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_PATH }}
          key: clang-r416183b

      - name: Download Clang 14 if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 ${{ env.CLANG_PATH }}

      - name: Cache KernelSU
        uses: actions/cache@v4
        with:
          path: KernelSU
          key: ksu-${{ env.KSU_VERSION }}

      - name: Clone KernelSU if cache missed
        if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --depth=1 -b ${{ env.KSU_VERSION }} https://github.com/tiann/KernelSU

      - name: Integrate KernelSU
        run: |
          mkdir -p kernel_platform/drivers/kernelsu
          cp -r KernelSU/kernel/* kernel_platform/drivers/kernelsu/

      - name: Verify KernelSU Integration
        run: |
          if [ ! -d kernel_platform/drivers/kernelsu ] || [ -z "$(ls -A kernel_platform/drivers/kernelsu)" ]; then
            echo "❌ KernelSU files not found in kernel_platform/drivers/kernelsu"
            exit 1
          fi
          echo "✅ KernelSU files are present"

      - name: Fetch SUSFS module
        if: ${{ github.event.inputs.SUSFS_CI != 'NoN' }}
        run: |
          SUSFS_TYPE="${{ github.event.inputs.SUSFS_CI }}"
          echo "Selected SUSFS download type: $SUSFS_TYPE"

          if [[ "$SUSFS_TYPE" == "CI" ]]; then
            SUSFS_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SUSFS/main/ci/susfs_module.tar.gz"
          elif [[ "$SUSFS_TYPE" == "Release" ]]; then
            SUSFS_URL="https://github.com/SukiSU-Ultra/SUSFS/releases/latest/download/susfs_module.tar.gz"
          fi

          echo "Downloading SUSFS from $SUSFS_URL..."
          mkdir -p kernel_platform/drivers/susfs
          curl -L "$SUSFS_URL" | tar xz -C kernel_platform/drivers/susfs

      - name: Verify SUSFS Module
        if: ${{ github.event.inputs.SUSFS_CI != 'NoN' }}
        run: |
          if [ ! -d kernel_platform/drivers/susfs ] || [ -z "$(ls -A kernel_platform/drivers/susfs)" ]; then
            echo "❌ SUSFS module missing in kernel_platform/drivers/susfs"
            exit 1
          fi
          echo "✅ SUSFS module is present"

      - name: Enable SUSFS in kernel config
        if: ${{ github.event.inputs.SUSFS_CI != 'NoN' }}
        run: |
          cd kernel_platform
          scripts/config --enable CONFIG_SUSFS
          scripts/config --enable CONFIG_SUSFS_MODULE

      - name: Apply KPM, SCHED, ZRAM, HOOK, FAST_BUILD flags
        run: |
          echo "FAST_BUILD=${{ github.event.inputs.FAST_BUILD }}"
          echo "KPM=${{ github.event.inputs.KPM }}"
          echo "SCHED=${{ github.event.inputs.SCHED }}"
          echo "ZRAM=${{ github.event.inputs.ZRAM }}"
          echo "HOOK=${{ github.event.inputs.HOOK }}"

      - name: Build kernel
        run: |
          PATH=$GITHUB_WORKSPACE/${{ env.CLANG_PATH }}/bin:$PATH
          make O=out ${{ env.DEFCONFIG }}
          make -j$(nproc) O=out \
            ARCH=$ARCH SUBARCH=$SUBARCH \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE \
            CC=clang

      - name: Apply custom/random kernel suffix
        run: |
          cd kernel_platform
          if [[ "${{ github.event.inputs.SUFFIX }}" != "" ]]; then
            SUFFIX="${{ github.event.inputs.SUFFIX }}"
          else
            RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
            RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
            SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
          fi
          echo "Using kernel suffix: $SUFFIX"
          # Inject suffix into setlocalversion scripts

      - name: Prepare AnyKernel3 zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          sed -i 's/device.name1=.*/device.name1=N200/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Nord-N200/' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=OnePlus-N200/' AnyKernel3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=holi/' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 KernelSU-N200.zip ./*

      - name: Upload AnyKernel3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-N200-zip
          path: AnyKernel3/KernelSU-N200.zip

      - name: Download stock boot.img
        run: |
          mkdir -p boot
          wget -O boot/stock-boot.img "https://example.com/holi-stock-boot.img"  # Replace with real URL

      - name: Install mkbootimg tools
        run: sudo apt install -y python3-pip unzip && sudo pip install mkbootimg

      - name: Unpack stock boot
        run: mkbootimg unpack boot/stock-boot.img -o boot/unpack/

      - name: Repack boot with new kernel
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb boot/unpack/
          mkbootimg repack -k boot/unpack/Image.gz-dtb \
            -r boot/unpack/ramdisk.img \
            -o boot/KernelSU-N200-boot.img

      - name: Upload repacked boot.img
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-N200-boot
          path: boot/KernelSU-N200-boot.img