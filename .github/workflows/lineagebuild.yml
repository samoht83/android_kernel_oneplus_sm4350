name: Build KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version tag (e.g., v0.9.5)'
        required: true
        default: 'v0.9.5'
        type: string
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'
        type: string

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: LineageOS/android_kernel_oneplus_sm4350
        ref: lineage-22.2
        fetch-depth: 1

    - name: Install dependencies (mkbootimg prebuilt)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git curl unzip python3 gcc-aarch64-linux-gnu jq build-essential \
          ccache android-sdk-libsparse-utils

    - name: Download Clang toolchain
      run: |
        CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r50/clang-r450784d.tar.xz"
        curl -L "$CLANG_URL" | tar -xJ -C $HOME
        echo "$HOME/clang-r450784d/bin" >> $GITHUB_PATH
        clang --version

    - name: Clone KernelSU
      run: |
        git clone --depth=1 -b ${{ github.event.inputs.kernelsu_version }} https://github.com/tiann/KernelSU
        cp -r KernelSU/kernel drivers/kernelsu
        echo 'obj-y += kernelsu/' >> drivers/Makefile
        echo 'CONFIG_KSU=y' >> arch/arm64/configs/vendor/holi_defconfig

    - name: Build kernel
      run: |
        export PATH=$HOME/clang-r450784d/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        mkdir -p out
        make O=out vendor/holi_defconfig
        make O=out -j$(nproc) CC=clang

    - name: Download stock boot image
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img
        ls -lh stock_boot.img

    - name: Unpack stock boot image
      run: |
        mkdir stock_boot
        unpack_bootimg --boot_img stock_boot.img --out stock_boot
        ls -l stock_boot

    - name: Repack new boot image with custom kernel
      run: |
        cp out/arch/arm64/boot/Image.gz stock_boot/kernel
        mkbootimg \
          --kernel stock_boot/kernel \
          --ramdisk stock_boot/ramdisk \
          --cmdline "$(cat stock_boot/cmdline)" \
          --base $(cat stock_boot/base) \
          --pagesize $(cat stock_boot/pagesize) \
          --os_version $(cat stock_boot/os_version) \
          --os_patch_level $(cat stock_boot/os_patch_level) \
          --second stock_boot/second \
          --dtb stock_boot/dtb \
          -o new_boot.img
        ls -lh new_boot.img

    - name: Upload new boot image
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-boot
        path: new_boot.img