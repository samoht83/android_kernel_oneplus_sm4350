name: Build 2 KernelSU Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'
      KERNEL_SOURCE_BRANCH:
        description: 'Kernel source branch to use'
        required: true
        default: 'lineage-22.2'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-android-
      CROSS_COMPILE_ARM32: arm-linux-androideabi-
      LLVM: 1
      LLVM_IAS: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
      CCACHE_COMPILERCHECK: content

    steps:
      # 0️⃣ Prepare apt-deps.txt before caching
      - name: Prepare APT Dependencies List
        run: |
          mkdir -p .github
          echo "git
          curl
          unzip
          python3
          ccache
          lz4
          libarchive-tools
          build-essential
          libncurses5-dev
          libssl-dev
          flex
          bison" > .github/apt-deps.txt

      # 1️⃣ Cache apt packages
      - name: Cache APT Packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('.github/apt-deps.txt') }}

      # 2️⃣ Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/apt-deps.txt)

      # 2️⃣a Install unpack_bootimg
      - name: Install unpack_bootimg
        run: |
          mkdir -p $HOME/unpack_bootimg
          curl -L https://github.com/xiaolu/mkbootimg_tools/releases/download/v1.0/unpack_bootimg_linux -o $HOME/unpack_bootimg/unpack_bootimg
          chmod +x $HOME/unpack_bootimg/unpack_bootimg
          echo "$HOME/unpack_bootimg" >> $GITHUB_PATH

      # 3️⃣ Cache ccache to reuse object files
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}-

      # 4️⃣ Cache kernel source folder
      - name: Cache Kernel Source
        uses: actions/cache@v4
        with:
          path: kernel
          key: kernel-source-${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            kernel-source-${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}-

      # 5️⃣ Checkout kernel if not cached
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: samoht83/android_kernel_oneplus_sm4350
          ref: ${{ github.event.inputs.KERNEL_SOURCE_BRANCH }}
          path: kernel

      # 6️⃣ Cache toolchains, mkbootimg, AnyKernel3
      - name: Create Toolchain Version File
        run: |
          mkdir -p build_scripts
          echo "clang-android-17.0.6-binutils-4.9" > build_scripts/toolchain_version.txt

      - name: Cache Toolchains & Helpers
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchains/clang
            toolchains/binutils
            $HOME/mkbootimg
            AnyKernel3
          key: toolchain-${{ hashFiles('build_scripts/toolchain_version.txt') }}

      - name: Download Toolchains & mkbootimg
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # Option: Use Neutron Clang (optimized, smaller download ~200MB)
          echo "Downloading Neutron Clang (optimized for kernel builds)..."
          NEUTRON_LATEST=$(curl -s https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | grep "tag_name" | cut -d '"' -f 4)
          curl -L "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/${NEUTRON_LATEST}/neutron-clang-${NEUTRON_LATEST}.tar.xz" -o neutron-clang.tar.xz
          mkdir -p clang
          tar -xf neutron-clang.tar.xz -C clang --strip-components=1
          rm neutron-clang.tar.xz
          
          # Alternative: If Neutron fails, use minimal AOSP clang
          if [ ! -f "clang/bin/clang" ]; then
            echo "Neutron failed, downloading minimal AOSP clang..."
            rm -rf clang
            curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" -o clang.tar.gz
            mkdir -p clang
            tar -xzf clang.tar.gz -C clang
            rm clang.tar.gz
          fi
          
          # Download GCC for binutils (fallback cross-compiler)
          echo "Downloading GCC binutils..."
          curl -L "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/main.tar.gz" -o binutils.tar.gz
          mkdir -p binutils
          tar -xzf binutils.tar.gz -C binutils
          rm binutils.tar.gz
          
          # Download mkbootimg
          MKBOOTIMG_URL="https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/master.tar.gz"
          mkdir -p $HOME/mkbootimg
          curl -L "$MKBOOTIMG_URL" | tar -xz -C $HOME/mkbootimg
          echo "$HOME/mkbootimg" >> $GITHUB_PATH

      # 7️⃣ Cache stock boot.img
      - name: Cache Stock Boot
        id: cache-stock-boot
        uses: actions/cache@v4
        with:
          path: stock_boot.img
          key: stock-boot-${{ github.event.inputs.stock_boot_url }}

      - name: Download Stock Boot
        if: steps.cache-stock-boot.outputs.cache-hit != 'true'
        run: |
          curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img

      # 8️⃣ Set up toolchain paths
      - name: Setup Toolchain Paths
        run: |
          # Debug: Check the actual structure of toolchains
          echo "Toolchain directory structure:"
          ls -la toolchains/
          echo "Clang directory structure:"
          ls -la toolchains/clang/
          
          # Find clang binary directly
          CLANG_PATH=$(find toolchains/clang -name "clang" -type f | head -1)
          if [ -n "$CLANG_PATH" ]; then
            CLANG_DIR=$(dirname "$CLANG_PATH")
            echo "Found Clang at: $CLANG_PATH"
            echo "Clang directory: $CLANG_DIR"
            echo "$(pwd)/$CLANG_DIR" >> $GITHUB_PATH
          else
            echo "Clang not found, trying alternative paths..."
            # Alternative: look for any bin directory in clang
            CLANG_BIN=$(find toolchains/clang -name "bin" -type d | head -1)
            if [ -n "$CLANG_BIN" ]; then
              echo "Found clang bin at: $CLANG_BIN"
              echo "$(pwd)/$CLANG_BIN" >> $GITHUB_PATH
            fi
          fi
          
          # Find binutils path
          BINUTILS_PATH=$(find toolchains/binutils -name "aarch64-linux-android-gcc" -type f | head -1)
          if [ -n "$BINUTILS_PATH" ]; then
            BINUTILS_DIR=$(dirname "$BINUTILS_PATH")
            echo "Found binutils at: $BINUTILS_PATH"
            echo "Binutils directory: $BINUTILS_DIR"
            echo "$(pwd)/$BINUTILS_DIR" >> $GITHUB_PATH
          fi

      # 9️⃣ Prepare kernel config & build
      - name: Build Kernel
        run: |
          ccache -M 5G
          mkdir -p kernel/out
          
          # Find and set up toolchain paths dynamically
          CLANG_PATH=$(find toolchains/clang -name "clang" -type f | head -1)
          BINUTILS_PATH=$(find toolchains/binutils -name "aarch64-linux-android-gcc" -type f | head -1)
          
          if [ -n "$CLANG_PATH" ]; then
            CLANG_DIR=$(dirname "$CLANG_PATH")
            export PATH="$(pwd)/$CLANG_DIR:$PATH"
            echo "Added clang to PATH: $(pwd)/$CLANG_DIR"
          fi
          
          if [ -n "$BINUTILS_PATH" ]; then
            BINUTILS_DIR=$(dirname "$BINUTILS_PATH")
            export PATH="$(pwd)/$BINUTILS_DIR:$PATH"
            echo "Added binutils to PATH: $(pwd)/$BINUTILS_DIR"
            export CROSS_COMPILE="$(pwd)/$BINUTILS_DIR/aarch64-linux-android-"
            export CROSS_COMPILE_ARM32="$(pwd)/$BINUTILS_DIR/arm-linux-androideabi-"
          fi
          
          # Verify tools are available
          echo "Checking toolchain availability:"
          which clang || echo "clang not found"
          which ld.lld || echo "ld.lld not found"
          which aarch64-linux-android-gcc || echo "aarch64-linux-android-gcc not found"
          
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          echo "Looking for suitable kernel config..."
          CONFIG_FOUND=false
          
          # List of possible config locations
          CONFIGS=(
            "configs/vendor/holi_QGKI.config"
            "arch/arm64/configs/vendor/holi_QGKI.config" 
            "arch/arm64/configs/holi_defconfig"
            "arch/arm64/configs/sm4350_defconfig"
            "arch/arm64/configs/oneplus_defconfig"
            "arch/arm64/configs/lineageos_oneplus_nord_n200_defconfig"
          )
          
          for config in "${CONFIGS[@]}"; do
            if [ -f "kernel/$config" ]; then
              echo "Found config: $config"
              cp "kernel/$config" kernel/out/.config
              CONFIG_FOUND=true
              break
            fi
          done
          
          if [ "$CONFIG_FOUND" = false ]; then
            echo "No predefined config found, using defconfig"
            make -C kernel O=out ARCH=arm64 CC=clang defconfig
          fi
          
          # Enable KernelSU and other necessary options
          echo "CONFIG_KSU=y" >> kernel/out/.config
          
          # Build kernel
          make -C kernel O=out ARCH=arm64 CC=clang olddefconfig
          make -j$(nproc) -C kernel O=out ARCH=arm64 CC=clang

      # 🔟 Unpack & repack boot image
      - name: Unpack Stock Boot
        run: |
          mkdir -p boot_unpack
          unpack_bootimg --boot_img stock_boot.img --out boot_unpack

      - name: Replace Kernel & Repack
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb boot_unpack/kernel
          else
            cat kernel/out/arch/arm64/boot/Image.gz kernel/out/arch/arm64/boot/dts/*.dtb > boot_unpack/kernel
          fi
          mkbootimg \
            --kernel boot_unpack/kernel \
            --ramdisk boot_unpack/ramdisk \
            --cmdline "$(cat boot_unpack/cmdline)" \
            --base "$(cat boot_unpack/base)" \
            --pagesize "$(cat boot_unpack/pagesize)" \
            --os_version "$(cat boot_unpack/os_version)" \
            --os_patch_level "$(cat boot_unpack/os_patch_level)" \
            --header_version "$(cat boot_unpack/header_version)" \
            -o new-boot.img

      # 1️⃣1️⃣ Package AnyKernel3 ZIP
      - name: Package AnyKernel3 ZIP
        run: |
          if [ ! -d AnyKernel3 ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
          fi
          cp new-boot.img AnyKernel3/boot.img
          cd AnyKernel3
          zip -r9 "AnyKernel3-NordN200-KernelSU-$(date +%s).zip" * -x .git README.md *placeholder
          mv *.zip $GITHUB_WORKSPACE/

      # 1️⃣2️⃣ Upload artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-KernelSU-ZIP
          path: "*.zip"