name: Build KernelSU-next Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        type: string
        default: 'https://raw.githubusercontent.com/samoht83/android_kernel_oneplus_sm4350/55c73263178dda755db0a217037d4e59c12c24aa/stock/original_boot.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_CACHE_DIR: ${{ github.workspace }}/clang
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo5 ccache curl git python3 unzip gcc-aarch64-linux-gnu jq build-essential python3-pip
        

    - name: Restore ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ github.workflow }}
        restore-keys: |
          ccache-

    - name: Restore Clang cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CLANG_CACHE_DIR }}
        key: clang-${{ env.CLANG_CACHE_DIR }}-v1

    - name: Download and install Clang (if missing)
      run: |
        CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android-14.0.0_r50/clang-r450784d.tar.gz"
        if [ ! -d "${{ env.CLANG_CACHE_DIR }}/bin" ]; then
          mkdir -p "${{ env.CLANG_CACHE_DIR }}"
          curl -L "$CLANG_URL" | tar -xz --strip-components=0 -C "${{ env.CLANG_CACHE_DIR }}"
        fi
        echo "${{ env.CLANG_CACHE_DIR }}/bin" >> $GITHUB_PATH
        clang --version

    - name: Download Android GCC 4.9 prebuilts
      run: |
        if [ ! -d "$HOME/aarch64-gcc/bin" ]; then
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 $HOME/aarch64-gcc
        fi
        echo "$HOME/aarch64-gcc/bin" >> $GITHUB_PATH

    - name: Clone kernel repo (shallow)
      run: |
        git clone --depth=1 --branch lineage-22.2 https://github.com/samoht83/android_kernel_oneplus_sm4350.git kernel
        ls -la kernel

    - name: Clone KernelSU-next and apply
      run: |
        git clone --depth=1 https://github.com/tiann/KernelSU-next.git KernelSU-next
        # kernel/ is the working kernel tree
        if [ -d "KernelSU-next/kernel" ]; then
          cp -r KernelSU-next/kernel/* kernel/
          if [ -f "KernelSU-next/kernel/patch.sh" ]; then
            pushd kernel
            bash ../KernelSU-next/kernel/patch.sh .
            popd
          fi
        else
          echo "KernelSU-next kernel folder not found, copied top-level files instead."
          cp -r KernelSU-next/* kernel/ || true
        fi

    - name: Ensure CONFIG_KSU in defconfig (only if missing)
      run: |
        DEFCONFIG=$(find kernel/arch/arm64/configs -name "*holi*_defconfig" | head -n1)
        if [ -n "$DEFCONFIG" ]; then
          if ! grep -q "^CONFIG_KSU=y" "$DEFCONFIG"; then
            echo "CONFIG_KSU=y" >> "$DEFCONFIG"
            echo "Added CONFIG_KSU=y to $DEFCONFIG"
          else
            echo "CONFIG_KSU already present in $DEFCONFIG"
          fi
        else
          echo "holi defconfig not found; attempting generic defconfig fallback"
          if [ -f kernel/arch/arm64/configs/defconfig ]; then
            echo "CONFIG_KSU=y" >> kernel/arch/arm64/configs/defconfig
          else
            echo "No suitable defconfig found; aborting"
            exit 1
          fi
        fi

    - name: Download stock boot.img
      run: |
        curl -L "${{ github.event.inputs.stock_boot_url }}" -o stock_boot.img
        file stock_boot.img || true

    - name: Build kernel (Clang + Android prebuilts + ccache)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$HOME/aarch64-gcc/bin:$PATH
        export PATH=${{ env.CLANG_CACHE_DIR }}/bin:$PATH
        export CC="ccache clang"
        export CXX="ccache clang++"
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export KBUILD_BUILD_USER=github
        export KBUILD_BUILD_HOST=actions
        cd kernel
        ccache --zero-stats
        make O=out holi_defconfig
        make -j$(nproc) O=out CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-
        ccache --show-stats

    - name: Unpack stock boot.img with pybootimg
      run: |
        mkdir unpacked
        pybootimg --unpack-bootimg stock_boot.img unpacked
        # pybootimg writes bootimg.json with offsets etc.
        ls -la unpacked

    - name: Put new kernel into unpacked ram (Image.gz-dtb)
      run: |
        cp kernel/out/arch/arm64/boot/Image.gz-dtb unpacked/
        ls -la unpacked

    - name: Repack boot.img (using mkbootimg from python tool or pybootimg)
      run: |
        # prefer pybootimg's repack if available:
        python3 - <<'PY'
import json,subprocess,sys,os
j=json.load(open('unpacked/bootimg.json'))
kernel='unpacked/Image.gz-dtb'
ramdisk='unpacked/ramdisk'
out='boot_kernelsu_next.img'
cmd=[
  'mkbootimg',
  '--kernel', kernel,
  '--ramdisk', ramdisk,
  '--base', str(j.get('base','0x0')),
  '--pagesize', str(j.get('pagesize', '4096')),
  '--kernel_offset', str(j.get('kernel_offset','0x00008000')),
  '--ramdisk_offset', str(j.get('ramdisk_offset','0x01000000')),
  '--tags_offset', str(j.get('tags_offset','0x000001000')),
  '-o', out
]
# fallback: try pybootimg repack if mkbootimg not present
try:
  subprocess.check_call(cmd)
except Exception:
  # try pybootimg repack (pybootimg has repack flag)
  subprocess.check_call(['pybootimg','--repack-bootimg','unpacked','-o',out])
print('wrote', out)
PY

    - name: Upload KernelSU-next boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot_kernelsu_next.img
        path: boot_kernelsu_next.img