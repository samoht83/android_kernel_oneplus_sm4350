name: Build KernelSU-Next Kernel and Repack Boot Image

on:
  workflow_dispatch:
    inputs:
      stock_boot_url:
        description: 'URL to the stock boot.img for repacking'
        required: true
        default: 'https://mirrorbits.lineageos.org/full/dre/20250808/boot.img'

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_CACHE_DIR: ${{ github.workspace }}/clang
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip python3 gcc-aarch64-linux-gnu jq build-essential ccache

      - name: Download mkbootimg and unpack_bootimg (Python scripts)
        run: |
          curl -L https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/master/mkbootimg.py?format=TEXT | base64 -d > mkbootimg.py
          chmod +x mkbootimg.py
          sudo mv mkbootimg.py /usr/local/bin/mkbootimg
          curl -L https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/master/unpack_bootimg.py?format=TEXT | base64 -d > unpack_bootimg.py
          chmod +x unpack_bootimg.py
          sudo mv unpack_bootimg.py /usr/local/bin/unpack_bootimg

      - name: Setup ccache
        run: |
          ccache --max-size=5G
          ccache --show-stats || true

      - name: Download and extract Clang
        run: |
          mkdir -p $CLANG_CACHE_DIR
          curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0-rc2/clang